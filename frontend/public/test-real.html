<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>真实渲染测试</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
body { background: #111; color: #eee; font-family: system-ui; margin: 0; padding: 20px; }
h1 { text-align: center; }
#status { text-align: center; color: #aaa; margin: 10px 0 20px; }
.container { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
.card { background: #222; border-radius: 12px; padding: 15px; text-align: center; }
.card h3 { margin: 0 0 10px; color: #888; font-size: 14px; }
canvas { border: 2px solid #444; background: #fff; }
img { border: 2px solid #444; max-width: 248px; }
#export-area { display: flex; gap: 30px; justify-content: center; margin-top: 20px; }
</style>
</head>
<body>
<h1>真实渲染对比</h1>
<div id="status">加载 design.json...</div>
<div class="container">
  <div class="card"><h3>📷 原图 preview.jpg</h3><img id="orig"></div>
  <div class="card"><h3>🟢 预生成 fabric.json 渲染</h3><canvas id="cPre"></canvas></div>
  <div class="card"><h3>🔵 运行时转换 JSON 渲染</h3><canvas id="cOurs"></canvas></div>
</div>
<div id="export-area"></div>

<script>
async function run() {
  const folder = 'gaoding_193254158_母婴知识科普手帐风小红书套装小红书配图';
  const status = document.getElementById('status');
  document.getElementById('orig').src = '/templates/' + folder + '/preview.jpg';

  try {
    // 加载预生成 fabric.json
    const preFabric = await (await fetch('/templates/' + folder + '/fabric.json')).json();
    status.textContent = '渲染预生成版本...';

    // 渲染预生成版本
    const cPre = new fabric.Canvas('cPre', {
      width: preFabric.width, height: preFabric.height,
      backgroundColor: preFabric.background || '#fff'
    });
    await new Promise(r => cPre.loadFromJSON(preFabric, () => { cPre.renderAll(); r(); }));
    const scalePre = Math.min(248 / preFabric.width, 332 / preFabric.height);
    document.getElementById('cPre').style.width = (preFabric.width * scalePre) + 'px';
    document.getElementById('cPre').style.height = (preFabric.height * scalePre) + 'px';

    // 加载 design.json
    status.textContent = '加载 design.json...';
    const design = await (await fetch('/templates/' + folder + '/design.json')).json();

    // 模拟我们的完整 gaodingToFabric 转换
    status.textContent = '执行转换并渲染...';

    function normalizeColor(hex) {
      if (!hex) return '#000000';
      if (hex.length === 9 && hex.startsWith('#')) {
        const a = parseInt(hex.slice(7, 9), 16) / 255;
        if (a >= 0.99) return '#' + hex.slice(1, 7);
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(2) + ')';
      }
      if (hex.length === 7 && hex.startsWith('#')) return hex;
      return hex;
    }

    function getAngle(t) {
      if (!t) return 0;
      if (t.a === 1 && t.b === 0) return 0;
      return Math.atan2(t.b, t.a) * 180 / Math.PI;
    }

    function getScale(t) {
      if (!t) return { scaleX: 1, scaleY: 1 };
      return {
        scaleX: Math.sqrt(t.a * t.a + t.b * t.b),
        scaleY: Math.sqrt(t.c * t.c + t.d * t.d),
      };
    }

    function makeImage(src, absLeft, absTop, displayW, displayH, naturalW, naturalH, scaleX, scaleY, angle, opacity, uuid, name) {
      const safeNW = naturalW > 0 ? naturalW : displayW;
      const safeNH = naturalH > 0 ? naturalH : displayH;
      return {
        type: 'Image', src, left: absLeft, top: absTop,
        width: safeNW, height: safeNH,
        scaleX: (displayW * scaleX) / safeNW,
        scaleY: (displayH * scaleY) / safeNH,
        angle: angle, opacity: opacity,
        originX: 'left', originY: 'top',
        shadow: null, crossOrigin: 'anonymous',
      };
    }

    function convertAny(el, goX, goY) {
      const { scaleX, scaleY } = getScale(el.transform);
      const absLeft = isFinite(goX + el.left * scaleX) ? goX + el.left * scaleX : (el.left || 0);
      const absTop = isFinite(goY + el.top * scaleY) ? goY + el.top * scaleY : (el.top || 0);

      if (el.hidden) return null;
      const nw = el.naturalWidth || el.width || 100;
      const nh = el.naturalHeight || el.height || 100;

      switch (el.type) {
        case 'text': {
          let text = el.content || '';
          if (el.contents && el.contents.length > 0) text = el.contents.map(c => c.content).join('');
          return {
            type: 'Textbox', text,
            left: absLeft, top: absTop,
            width: el.width * scaleX, height: el.height * scaleY,
            fill: normalizeColor(el.color || '#000000'),
            fontSize: Math.round(el.fontSize * 0.75),
            fontFamily: el.fontFamily || 'PingFang SC',
            fontWeight: (el.fontWeight || 400) >= 500 ? 'bold' : 'normal',
            lineHeight: el.lineHeight || 1.2,
            charSpacing: (el.letterSpacing || 0) * 10,
            textAlign: el.textAlign === 'justify' ? 'justify' : (el.textAlign || 'left'),
            angle: getAngle(el.transform), opacity: el.opacity,
            originX: 'left', originY: 'top',
            underline: el.textDecoration === 'underline',
            linethrough: el.textDecoration === 'line-through',
            overline: el.textDecoration === 'overline',
          };
        }
        case 'image': {
          const url = el.url || '';
          const filename = url.split('?')[0].split('/').pop();
          return makeImage(
            '/templates/' + folder + '/images/' + filename,
            absLeft, absTop, el.width, el.height,
            nw, nh, scaleX, scaleY, getAngle(el.transform), el.opacity
          );
        }
        case 'svg': {
          const url = el.url || '';
          const filename = url.split('?')[0].split('/').pop();
          return makeImage(
            '/templates/' + folder + '/images/' + filename,
            absLeft, absTop, el.width, el.height,
            nw, nh, scaleX, scaleY, getAngle(el.transform), el.opacity
          );
        }
        case 'group': {
          if (el.hidden) return null;
          const children = [];
          if (el.elements) {
            for (const child of el.elements) {
              const c = convertAny(child, 0, 0);
              if (c) children.push(c);
            }
          }
          if (children.length === 0) return null;
          return {
            type: 'Group', left: absLeft, top: absTop,
            width: el.width * scaleX, height: el.height * scaleY,
            scaleX, scaleY, angle: getAngle(el.transform),
            opacity: el.opacity,
            originX: 'left', originY: 'top',
            objects: children, shadow: null,
          };
        }
        case 'layout':
        case 'table': case 'tableRow': case 'tableCell':
        case 'path':
          return null;
        default:
          if (el.elements) return convertAny(el, goX, goY);
          return null;
      }
    }

    const layout = design.layouts[0];
    const objects = [];
    if (layout.elements) {
      for (const child of layout.elements) {
        const converted = convertAny(child, 0, 0);
        if (converted) objects.push(converted);
      }
    }

    const ourFabric = {
      version: '5.3.0',
      objects,
      background: 'rgba(255,255,255,0.00)',
      width: design.global.layout.width,
      height: design.global.layout.height,
    };

    // 渲染我们转换的版本
    const cOurs = new fabric.Canvas('cOurs', {
      width: ourFabric.width, height: ourFabric.height,
      backgroundColor: ourFabric.background || '#fff'
    });
    await new Promise(r => cOurs.loadFromJSON(ourFabric, () => { cOurs.renderAll(); r(); }));
    const scaleOurs = Math.min(248 / ourFabric.width, 332 / ourFabric.height);
    document.getElementById('cOurs').style.width = (ourFabric.width * scaleOurs) + 'px';
    document.getElementById('cOurs').style.height = (ourFabric.height * scaleOurs) + 'px';

    // 导出 PNG
    const exportArea = document.getElementById('export-area');

    const cardPre = document.createElement('div');
    cardPre.className = 'card';
    cardPre.innerHTML = '<h3>🟢 预生成导出</h3>';
    const imgPre = document.createElement('img');
    imgPre.src = cPre.toDataURL({ format: 'png', quality: 1 });
    cardPre.appendChild(imgPre);
    exportArea.appendChild(cardPre);

    const cardOurs = document.createElement('div');
    cardOurs.className = 'card';
    cardOurs.innerHTML = '<h3>🔵 运行时转换导出</h3>';
    const imgOurs = document.createElement('img');
    imgOurs.src = cOurs.toDataURL({ format: 'png', quality: 1 });
    cardOurs.appendChild(imgOurs);
    exportArea.appendChild(cardOurs);

    status.textContent = '✅ 渲染完成！请对比图片';

    // 打印调试信息
    console.log('=== 预生成 fabric.json ===');
    console.log('Canvas:', preFabric.width, 'x', preFabric.height);
    console.log('Objects:', preFabric.objects.length);
    for (const obj of preFabric.objects) {
      console.log(' ', obj.type, 'at', obj.left, obj.top, 'size', obj.width, 'x', obj.height);
      if (obj.objects) {
        console.log('   children:', obj.objects.length);
        for (let i = 0; i < obj.objects.length; i++) {
          const c = obj.objects[i];
          console.log('     [' + i + ']', c.type, 'at', c.left?.toFixed?.(1), c.top?.toFixed?.(1), 'w=' + c.width, 'h=' + c.height, 'sx=' + c.scaleX?.toFixed?.(4), 'sy=' + c.scaleY?.toFixed?.(4));
        }
      }
    }
    console.log();
    console.log('=== 运行时转换 fabric JSON ===');
    console.log('Canvas:', ourFabric.width, 'x', ourFabric.height);
    console.log('Objects:', ourFabric.objects.length);
    for (const obj of ourFabric.objects) {
      console.log(' ', obj.type, 'at', obj.left, obj.top, 'size', obj.width, 'x', obj.height);
      if (obj.objects) {
        console.log('   children:', obj.objects.length);
        for (let i = 0; i < obj.objects.length; i++) {
          const c = obj.objects[i];
          console.log('     [' + i + ']', c.type, 'at', c.left?.toFixed?.(1), c.top?.toFixed?.(1), 'w=' + c.width, 'h=' + c.height, 'sx=' + c.scaleX?.toFixed?.(4), 'sy=' + c.scaleY?.toFixed?.(4));
        }
      }
    }
  } catch (e) {
    status.textContent = '❌ 错误: ' + e.message;
    console.error(e);
    document.getElementById('status').style.color = '#f66';
  }
}

run();
</script>
</body>
</html>
