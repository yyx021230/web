    - data:
        code: |-
          import json
          import re

          def _repair_json_text(raw):
              """Repair common LLM JSON slips without changing the actual copy."""
              out = []
              in_string = False
              escaped = False
              size = len(raw)
              for index, char in enumerate(raw):
                  if not in_string:
                      out.append(char)
                      if char == '"':
                          in_string = True
                      continue
                  if escaped:
                      out.append(char)
                      escaped = False
                      continue
                  if char == "\\":
                      out.append(char)
                      escaped = True
                      continue
                  if char in "\r\n":
                      out.append("\\n")
                      continue
                  if char == '"':
                      lookahead = index + 1
                      while lookahead < size and raw[lookahead].isspace():
                          lookahead += 1
                      next_char = raw[lookahead] if lookahead < size else ""
                      if not next_char or next_char in ":,}]":
                          out.append(char)
                          in_string = False
                      else:
                          out.append('\\"')
                      continue
                  out.append(char)
              return "".join(out)

          def _parse(value):
              if isinstance(value, dict):
                  return value
              raw = str(value or "").strip()
              raw = re.sub(r"^```(?:json)?\s*", "", raw, flags=re.I)
              raw = re.sub(r"\s*```$", "", raw)
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError:
                  match = re.search(r"\{.*\}", raw, flags=re.S)
                  candidate = match.group(0) if match else raw
                  try:
                      parsed = json.loads(_repair_json_text(candidate))
                  except Exception as exc:
                      return {
                          "slot": 0,
                          "title": "",
                          "content": "",
                          "primary_copy_id": None,
                          "source_copy_ids": [],
                          "source_use_notes": ["模型 JSON 格式异常，已阻断本篇：" + str(exc)[:120]],
                          "policy_evidence": [],
                          "policy_expression": "",
                          "selected_prompt_id": "",
                          "selected_prompt_original": "",
                          "image_text_blocks": [],
                          "image_prompt": "",
                          "prompt_change_note": ""
                      }
              if not isinstance(parsed, dict):
                  raise ValueError("单篇草稿必须是 JSON 对象")
              return parsed

          def main(drafts) -> dict:
              values = list(drafts or [])
              normalized = []
              for index, value in enumerate(values, start=1):
                  item = _parse(value)
                  item["slot"] = index
                  # 终审只需要提示词编号与改写稿；完整原提示词会在硬校验阶段
                  # 依据 selected_prompt_id 从提示词候选中恢复。提前清空可避免
                  # 大段提示词被模型原样回传，造成终审 JSON 超长截断。
                  item["selected_prompt_original"] = ""
                  normalized.append(item)
