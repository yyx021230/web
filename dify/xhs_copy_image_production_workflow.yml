app:
  description: >-
    从线上文案库、提示词库和车型库取材；一次生成 1-5 篇小红书文案，完成合规复核后，
    使用“轻改提示词 + 对应车型辅助图”并发提交线上生图任务。政策事实只允许来自本次输入。
  icon: 🚗
  icon_background: '#E8F5E9'
  mode: workflow
  name: 小红书汽车文案配图生产（高保真复刻版）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
