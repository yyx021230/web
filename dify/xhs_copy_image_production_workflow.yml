      targetPosition: left
      type: custom
      width: 270
    - data:
        code: |-
          import re

          def main(run_id: str, post_count: str, brand: str, vehicle_model: str, policy_text: str, account_name: str) -> dict:
              brand_name = str(brand or "").strip()
              model = str(vehicle_model or "").strip()
              policy = str(policy_text or "").strip()
              if not model:
                  raise ValueError("车型不能为空")
              if "A01" in model.upper():
                  raise ValueError("A01 已按业务要求忽略，请输入本次实际需要生产的车型")
              if len(policy) < 8:
                  raise ValueError("政策原文过短；请粘贴飞书政策文档中的有效内容")
              count = max(1, min(5, int(post_count or 1)))
              seed = sum(ord(ch) for ch in (str(run_id or "") + "|" + str(account_name or "")))
              copy_page = seed % 14 + 1
              policy_model_match = re.search(r"(?:车型|车系|车款)\s*[:：]\s*([^\n\r]+)", policy)
              policy_model = policy_model_match.group(1).strip() if policy_model_match else ""
              return {
                  "copy_page": copy_page,
                  "copy_page_2": (copy_page + 4 - 1) % 14 + 1,
                  "copy_page_3": (copy_page + 9 - 1) % 14 + 1,
                  "prompt_page": seed % 4 + 1,
                  "vehicle_knowledge_query": (
                      f"{brand_name} {model} {policy_model} 当前在售 官网 当前年款 具体版本 "
                      "续航 电池 动力 尺寸 快充 底盘 智驾 标配 选配"
                  ).strip(),
                  "slots": [str(i) for i in range(1, count + 1)]
              }
        code_language: python3
        desc: 自动轮换文案库页，避免每次都取同一批素材，并生成批量生产槽位。
        outputs:
          copy_page:
            children: null
            type: number
          copy_page_2:
            children: null
            type: number
          copy_page_3:
            children: null
            type: number
          prompt_page:
            children: null
            type: number
          vehicle_knowledge_query:
            children: null
            type: string
          slots:
            children: null
            type: array[string]
        selected: false
        title: 轮换素材页并建批次
        type: code
        variables:
