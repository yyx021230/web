    - data:
        code: |-
          import hashlib
          import json
          import re

          NEGATIVE = (
              "无文字，文字模糊，错别字，乱码，联系方式，二维码，导流信息，旗帜，"
              "极限价格宣传，夸张促销语，错误车型，车身结构改变，车标错误，多余车辆"
          )

          def main(item_json: str, run_id: str, image_model: str,
                   image_width: str, image_height: str) -> dict:
              item = json.loads(item_json)
              slot = int(item.get("slot") or 1)
              vehicle = item.get("vehicle_image") or {}
              vehicle_url = str(vehicle.get("url") or "").strip()
              if not vehicle_url:
                  raise ValueError("车型辅助图 URL 为空")
              prompt = str(item.get("image_prompt") or "").strip()
              blocks = [str(x).strip() for x in (item.get("image_text_blocks") or []) if str(x).strip()]
              model_name = str(item.get("vehicle_model") or "").strip()
              prompt += (
                  "\n\n强制执行：只做轻微场景变化，保留选中原提示词的整体构图、镜头和文字排版。"
                  "画面必须清晰呈现这些中文文字区块：" + "｜".join(blocks) + "。"
                  "车辆必须是" + model_name + "，外形、颜色、车标、轮毂、车身比例严格跟随输入的车型库辅助图；"
                  "辅助图只约束车辆，不照搬辅助图背景。不得出现联系方式、二维码、旗帜或夸张营销元素。"
              )
              primary_id = str(item.get("primary_copy_id") or "0")
              content_hash = str(item.get("content_fingerprint") or "").strip()
              if not re.fullmatch(r"[0-9a-f]{12}", content_hash):
                  normalized_copy = re.sub(
                      r"[\s#，。！？、,.!~～—\-]", "",
                      (str(item.get("title") or "") + str(item.get("content") or "")).lower(),
                  )
                  content_hash = hashlib.sha256(normalized_copy.encode("utf-8")).hexdigest()[:12]
              run_fragment = re.sub(r"[^0-9A-Za-z]", "", str(run_id or ""))[:18] or "run"
              request_id = (f"xhs-p{primary_id}-c{content_hash}-r{run_fragment}-s{slot}")[:64]
              body = {
                  "prompt": prompt,
                  "client_request_id": request_id,
                  "negative_prompt": NEGATIVE,
                  "model": str(image_model or "gptimage2"),
                  "width": int(image_width or 2048),
                  "height": int(image_height or 2048),
                  "quality": "high",
                  "count": 1,
                  "images_data": [vehicle_url]
              }
              return {
                  "request_json": json.dumps(body, ensure_ascii=False),
                  "slot": slot,
                  "request_id": request_id,
                  "vehicle_image_url": vehicle_url,
                  "content_item_json": json.dumps(item, ensure_ascii=False)
              }
        code_language: python3
