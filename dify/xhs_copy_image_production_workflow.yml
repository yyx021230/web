    - data:
        code: |-
          import json

          def _load(value):
              try:
                  return json.loads(value or "{}")
              except Exception:
                  return {"raw": str(value or "")}

          def main(safe_items, image_responses, blocked_json: str,
                   library_trace_json: str, backend_base_url: str,
                   image_model: str) -> dict:
              safe = []
              for value in list(safe_items or []):
                  try:
                      safe.append(json.loads(value))
                  except Exception:
                      safe.append({"raw": value})
              responses = list(image_responses or [])
              delivered = []
              task_summaries = []

              for idx, item in enumerate(safe):
                  response = _load(responses[idx] if idx < len(responses) else "")
                  data = response.get("data", response) if isinstance(response, dict) else {}
                  task_id = str(data.get("task_id") or "") if isinstance(data, dict) else ""
                  status = str(data.get("status") or "submit_failed") if isinstance(data, dict) else "submit_failed"
                  quality_review = response.get("quality_review", {}) if isinstance(response, dict) else {}
                  quality_pass = response.get("quality_pass") if isinstance(response, dict) else None
                  regenerated = bool(response.get("regenerated")) if isinstance(response, dict) else False
                  if status == "completed" and quality_pass is False:
                      status = "completed_quality_rejected_after_retry"
                  image_urls = data.get("image_urls", []) if isinstance(data, dict) else []
                  if status != "completed" or quality_pass is not True or not image_urls:
                      raise ValueError(
                          "成图最终质检未通过，停止交付：slot=%s, task_id=%s, status=%s, regenerated=%s"
                          % (item.get("slot"), task_id or "-", status, regenerated)
                      )
                  poll_url = ""
                  if task_id:
                      poll_url = str(backend_base_url).rstrip("/") + "/ai-image/tasks/" + task_id + "?model=" + str(image_model)
                  result = {
                      "slot": item.get("slot"),
                      "account_name": item.get("account_name"),
                      "brand": item.get("brand"),
                      "vehicle_model": item.get("vehicle_model"),
                      "title": item.get("title"),
                      "content": item.get("content"),
                      "primary_copy_id": item.get("primary_copy_id"),
                      "source_copy_ids": item.get("source_copy_ids"),
                      "source_use_notes": item.get("source_use_notes"),
                      "policy_evidence": item.get("policy_evidence"),
                      "selected_prompt_id": item.get("selected_prompt_id"),
                      "selected_prompt_original": item.get("selected_prompt_original"),
                      "image_prompt": item.get("image_prompt"),
                      "prompt_change_note": item.get("prompt_change_note"),
                      "image_text_blocks": item.get("image_text_blocks"),
                      "vehicle_image": item.get("vehicle_image"),
                      "image_task_id": task_id,
                      "image_task_status": status,
                      "image_urls": image_urls,
                      "image_quality_pass": quality_pass,
                      "image_quality_review": quality_review,
                      "image_regenerated": regenerated,
                      "poll_url": poll_url,
                      "submit_response": response
                  }
                  delivered.append(result)
                  task_summaries.append({
                      "slot": item.get("slot"),
                      "task_id": task_id,
                      "status": status,
                      "poll_url": poll_url
                  })

              blocked = _load(blocked_json)
              trace = _load(library_trace_json)
              lines = ["本批已完成文案终审，并提交合规项的线上生图任务。"]
              for item in delivered:
                  lines.extend([
                      "",
                      "【第%s篇｜%s】" % (item.get("slot"), item.get("vehicle_model")),
                      "标题：" + str(item.get("title") or ""),
                      "正文：\n" + str(item.get("content") or ""),
                      "文案来源：" + "、".join(str(x) for x in (item.get("source_copy_ids") or [])),
                      "主参考：" + str(item.get("primary_copy_id") or ""),
                      "提示词来源：" + str(item.get("selected_prompt_id") or ""),
                      "提示词轻改说明：" + str(item.get("prompt_change_note") or ""),
                      "车型辅助图：" + str((item.get("vehicle_image") or {}).get("url") or ""),
                      "生图任务：%s（%s）" % (item.get("image_task_id") or "未提交", item.get("image_task_status") or "未知")
                      ,"成图质检：%s%s" % (
                          "通过" if item.get("image_quality_pass") else "未通过",
                          "（已自动重生一次）" if item.get("image_regenerated") else ""
                      )
                  ])
              if blocked:
                  lines.extend(["", "有 %s 篇未通过硬校验，未提交生图；详见 blocked_items。" % len(blocked)])
              return {
                  "delivery_text": "\n".join(lines),
                  "delivery_json": json.dumps(delivered, ensure_ascii=False),
                  "blocked_items": json.dumps(blocked, ensure_ascii=False),
                  "image_tasks_json": json.dumps(task_summaries, ensure_ascii=False),
                  "library_trace_json": json.dumps(trace, ensure_ascii=False)
              }
        code_language: python3
        desc: 将文案、参考来源、提示词、车型辅助图和线上生图任务一一配对交付。
        outputs:
          blocked_items:
            children: null
            type: string
          delivery_json:
            children: null
            type: string
          delivery_text:
            children: null
            type: string
          image_tasks_json:
            children: null
            type: string
          library_trace_json:
            children: null
            type: string
        selected: false
