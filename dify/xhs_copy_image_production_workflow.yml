    - data:
        code: |-
          import hashlib
          import json
          import re
          from difflib import SequenceMatcher

          def _payload(body, name):
              try:
                  raw = json.loads(body or "{}")
              except Exception as exc:
                  raise ValueError(name + "接口没有返回 JSON") from exc
              if isinstance(raw, dict) and raw.get("code", 0) != 0:
                  raise ValueError(name + "接口失败：" + str(raw.get("message") or raw))
              return raw.get("data", raw) if isinstance(raw, dict) else raw

          def _norm(value):
              return str(value or "").strip()

          def _style_profile(content):
              text = _norm(content)
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              paragraphs = [part for part in re.split(r"\n\s*\n", text) if part.strip()]
              prefix_types = []
              for line in lines[:12]:
                  if re.match(r"^[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️]", line):
                      prefix_types.append("emoji")
                  elif re.match(r"^[-—_=·•]+$", line):
                      prefix_types.append("separator")
                  elif re.match(r"^[一二三四五六七八九十\d]+[、.）)]", line):
                      prefix_types.append("number")
                  elif re.match(r"^[🔸▪︎◾▶︎☑️✔️]", line):
                      prefix_types.append("bullet")
                  else:
                      prefix_types.append("text")
              emoji = re.findall(r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️]", text)
              opening = "".join(lines[:2])[:180]
              opening = re.sub(r"20\d{2}年\d{1,2}月\d{1,2}日|\d+(?:\.\d+)?", "数字", opening)
              opening = re.sub(r"[A-Za-z]+\d+", "车型", opening)
              opening = re.sub(r"[\s#\[\]话题，。！？、,.!~～—\-]", "", opening)
              return {
                  "line_band": min(10, len(lines) // 3),
                  "paragraph_band": min(8, len(paragraphs)),
                  "prefix": tuple(prefix_types),
                  "emoji": tuple(emoji[:10]),
                  "has_separator": any(kind == "separator" for kind in prefix_types),
                  "has_question": "？" in text or "?" in text,
                  "has_numbered": "number" in prefix_types,
                  "opening": opening,
              }

          def _style_distance(left, right):
              prefix_len = max(1, min(len(left["prefix"]), len(right["prefix"])))
              same_prefix = sum(
                  1 for idx in range(prefix_len)
                  if left["prefix"][idx] == right["prefix"][idx]
              ) / prefix_len
              emoji_len = max(1, min(len(left["emoji"]), len(right["emoji"])))
              same_emoji = sum(
                  1 for idx in range(emoji_len)
                  if idx < len(left["emoji"]) and idx < len(right["emoji"])
                  and left["emoji"][idx] == right["emoji"][idx]
              ) / emoji_len
              opening_ratio = SequenceMatcher(None, left["opening"], right["opening"]).ratio()
              return (
                  min(3, abs(left["line_band"] - right["line_band"])) * 0.8
                  + min(3, abs(left["paragraph_band"] - right["paragraph_band"])) * 0.7
                  + (1 - same_prefix) * 3.5
                  + (1 - same_emoji) * 2.0
                  + (1.2 if left["has_separator"] != right["has_separator"] else 0)
                  + (0.8 if left["has_question"] != right["has_question"] else 0)
                  + (0.8 if left["has_numbered"] != right["has_numbered"] else 0)
                  + (1 - opening_ratio) * 5.0
              )

          def _stable_jitter(run_id, item_id):
              digest = hashlib.sha256((str(run_id) + ":" + str(item_id)).encode("utf-8")).hexdigest()
              return int(digest[:8], 16) / 0xFFFFFFFF

          LINE_BANNED = (
              "私信", "加微信", "微信号", "扫码", "电话", "站外", "评论区", "评论",
              "留言", "回复", "咨询", "点击", "领取", "赠送", "进群", "联系方式",
              "扣【", "留【", "立即咨询", "手慢无", "错过", "闭眼",
          )
          POLICY_OUTPUT_BANNED = (
              "私信", "加微信", "微信号", "扫码", "电话", "站外引流",
              "白嫖", "白送", "送你", "赠送", "免费", "发你", "评论区", "评论",
              "国旗", "国家", "薅", "崩", "秒发", "底价",
              "全网最低", "最便宜", "抄底", "闭眼", "直降", "下调",
              "跳水", "割韭菜", "冲量", "内部", "隐藏福利", "行情曝光",
              "618", "双11", "双12", "链接", "一手资讯", "抢先看",
          )
          POLICY_OUTPUT_SEMANTIC = re.compile(
              r"月薪.{0,10}(?:轻松|也能).{0,8}(?:拥有|入手)|"
              r"人人都能.{0,8}(?:拥有|入手)|轻松(?:拥有|入手)|"
              r"被问.{0,6}链接|要链接|求链接|"
              r"最高标准|辨识度拉满|实力拉满|操作丝滑|顶级|完美"
          )
          CTA_TEMPLATE_LINE = re.compile(
              r"想预约|想体验|想知道|想了解|想看|想算|预约|咨询|滴滴|私信|"
              r"留【|扣【|(?:城市|地区)\s*[+＋]|城市】|找我|发你|帮你"
          )
          POLICY_FACT_LINE = re.compile(
              r"20\d{2}年|\d{1,2}月|\d{1,2}日|(?:一|二|三|四|五|六|七|八|九|十|十一|十二)月|\d+(?:\.\d+)?\s*(?:元|万|万元|%|折)|"
              r"价格|报价|优惠|福利|权益|补贴|金融|首付|月供|免息|利息|锁单|"
              r"下定|提车价|指导价|库存|名额|限时|截止|截至|政策|新政|活动"
          )
          PRODUCT_FACT_LINE = re.compile(
              r"续航|智驾|智能驾驶|座椅|底盘|动力|加速|空间|车机|配置|悬架|"
              r"电池|内饰|外观|操控|车漆|轮毂|芯片|雷达|快充|油耗|功率|扭矩|"
              r"安全气囊|后备箱|轴距|车长|纯电|增程|混动|版本"
          )
          UNSUPPORTED_STATE_LINE = re.compile(
              r"已开启|已上线|已落地|已启动|进行中|正在开展|已经安排|已确认|已解锁"
          )

          def _compact(value):
              return re.sub(r"[^0-9A-Za-z\u4e00-\u9fff]", "", str(value or "")).lower()

          def _current_model_source(title, content, vehicle_model):
              model = _compact(vehicle_model)
              core = re.sub(r"^(?:零跑汽车|零跑|leapmotor)", "", model)
              title_text = _compact(title)
              target_code = re.sub(r"\s+", "", core)
              title_codes = {
                  re.sub(r"\s+", "", value.lower())
                  for value in re.findall(r"(?i)[a-z]{1,5}\s*\d{1,3}", str(title or ""))
              }
              # 只有标题明确写出目标车型，才允许保留产品事实。正文或话题标签出现目标
              # 车型不足以证明整篇属于它；标题同时列出其他车型时也按跨车型处理。
              return bool(
                  ((model and model in title_text) or (len(core) >= 2 and core in title_text))
                  and (not title_codes or title_codes == {target_code})
              )

          def _policy_facts(policy):
              facts = []
              for part in re.split(r"(?<=[。！？!?；;])|\n+", str(policy or "")):
                  clean = part.strip()
                  if (
                      clean
                      and not any(word in clean for word in POLICY_OUTPUT_BANNED)
                      and not POLICY_OUTPUT_SEMANTIC.search(clean)
                      and clean not in facts
                  ):
                      facts.append(clean)
              return facts

          def _policy_expression(fact, mode):
              """只变表达，不改变车型、日期、金额、条件或核验口径。"""
              original = str(fact or "").strip()
              clean = original.rstrip("。！？!?；;")
              deadline = re.match(
                  r"^(.+?)(?:截止|截至)(20\d{2}年\d{1,2}月\d{1,2}日)$",
                  clean,
              )
              if deadline:
                  subject, date_text = deadline.groups()
                  subject = subject.strip()
                  if mode == 1:
                      return f"准备参加{subject.replace('活动', '')}，可以先记下{date_text}这个时间点。"
                  if mode == 2:
                      return f"{subject}的时间节点为{date_text}。"
                  if mode == 3:
                      return f"准备看车的，可留意{subject}截至{date_text}。"
                  if mode == 4:
                      return f"{subject.replace('活动', '')}的截止时间是{date_text}。"
                  return original
              if "门店公布" in clean and "现场核验" in clean and "为准" in clean:
                  variants = [
                      original,
                      "具体时间与到店细节，可参考门店公布信息，并结合现场核验结果。",
                      "到店前可先查看门店公布内容，具体安排还需现场核验。",
                      "确认具体安排时，可参考门店公布信息和现场核验结果。",
                      "具体活动怎么安排，可结合门店公布信息与现场核验情况确认。",
                  ]
                  return variants[mode % len(variants)]
              return original

          def _symbol_lead_close(source, policy, vehicle_model):
              """保留文案库的符号承接：禁敏感文字，但不删除留资功能。"""
              source_text = str(source or "")
              model = str(vehicle_model or "").strip()
              model_label = re.sub(r"^(?:零跑汽车|零跑)", "", model, flags=re.I).strip() or model
              cue_tokens = re.findall(r"⬇️|👇|👉|💬|📩", source_text)
              cue = "".join(cue_tokens[:2]) or "⬇️💬"
              if "💬" not in cue and "📩" not in cue:
                  cue += "💬"
              combined = source_text + "\n" + str(policy or "")
              if "试驾" in source_text and "试驾" in str(policy or ""):
                  benefit = "了解本地方案和实车体验安排"
              elif any(word in combined for word in ("版本", "配置")):
                  benefit = "了解本地方案和版本明细"
              elif any(word in combined for word in ("补贴", "权益")):
                  benefit = "了解本地方案和权益明细"
              else:
                  benefit = "了解本月落地方案"
              tail_tokens = re.findall(r"💰|✨|✅|🔥|💡|💌", source_text)
              tail = tail_tokens[-1] if tail_tokens else "💰"
              return f"{cue}【城市＋{model_label}】，{benefit}{tail}"

          def _template_policy_close(source, policy, vehicle_model, mode):
              return _symbol_lead_close(source, policy, vehicle_model)
              # 以下旧分支保留仅用于兼容历史 DSL；当前统一采用母版符号承接。
              facts = _policy_facts(policy)
              deadline_fact = next((fact for fact in facts if re.search(r"截止|截至", fact)), "")
              deadline = re.search(r"20\d{2}年\d{1,2}月\d{1,2}日", deadline_fact)
              gate_ok = any("门店公布" in fact and "现场核验" in fact for fact in facts)
              if not deadline or not gate_ok:
                  ending_emoji = "".join(re.findall(
                      r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️💌👇📸📷💬📩]", str(source or "")
                  )[-2:])
                  model = str(vehicle_model or "").strip()
                  lead_variants = [
                      f"想知道{model}这次权益怎么搭配更合适？车型版本、购车方式和预算一起看会更清楚{ending_emoji}",
                      f"想核算{model}的购车方案？先把城市、版本和预算整理好，比较起来更清楚{ending_emoji}",
                      f"想了解{model}哪套金融方案更适合？把用车需求、车型版本和预算放在一起看{ending_emoji}",
                      f"想体验{model}实车、再核算本地方案？城市、版本和预算这三项先准备好{ending_emoji}",
                      f"想看{model}不同购车方式怎么选？按车型版本、预算和用车需求逐项比较更直观{ending_emoji}",
                  ]
                  variant_seed = int(hashlib.sha256(
                      (str(source or "") + "|" + model).encode("utf-8")
                  ).hexdigest()[:8], 16)
                  return lead_variants[variant_seed % len(lead_variants)]
              date_text = deadline.group(0)
              model = str(vehicle_model or "").strip()
              ending_emoji = "".join(re.findall(
                  r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️💌👇📸📷💬📩]", str(source or "")
              )[-2:])
              source_text = str(source or "")
              if "想知道" in source_text or "想算" in source_text or "？" in source_text or "?" in source_text:
                  return f"想知道{model}到店试驾怎么安排？活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              if "想预约" in source_text or "预约" in source_text:
                  return f"想预约{model}实车体验、了解这次到店试驾安排，活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              if "想体验" in source_text:
                  return f"想体验{model}、了解这次到店试驾安排，活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              if "想看" in source_text:
                  return f"想看{model}实车、了解试驾细节和到店安排，活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              if "想了解" in source_text:
                  return f"想了解{model}到店试驾信息，活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              variants = [
                  f"{model}到店试驾时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认。",
                  f"准备看{model}的，可先记下{date_text}，到店安排结合门店公布信息和现场核验情况确认。",
              ]
              return variants[mode % len(variants)]

          def _line_plan_with_policy_style(base_plan, policy, vehicle_model, mode):
              plan = json.loads(json.dumps(base_plan, ensure_ascii=False))
              facts = _policy_facts(policy)
              replacements = [_policy_expression(fact, mode) for fact in facts]
              has_safe_close = any(
                  row.get("action") == "SAFE_POLICY_CLOSE" for row in plan.get("lines") or []
              )
              index = 0
              for row in plan.get("lines") or []:
                  if row.get("action") == "SAFE_POLICY_CLOSE":
                      row["replacement"] = _template_policy_close(
                          row.get("source"), policy, vehicle_model, mode
                      )
                      row["policy_source"] = facts
                  elif row.get("action") == "POLICY_REPLACE":
                      if has_safe_close:
                          row["action"] = "DELETE"
                          row["replacement"] = ""
                      else:
                          if index < len(replacements):
                              row["replacement"] = replacements[index]
                              row["policy_source"] = facts[index]
                          index += 1
              kept = [row for row in plan.get("lines") or [] if row.get("action") != "DELETE"]
              plan["expected_output_line_count"] = len(kept)
              plan["safe_emoji_sequence"] = [emoji for row in kept for emoji in row.get("emoji", [])]
              plan["delete_count"] = len(plan.get("lines") or []) - len(kept)
              plan["editable_ratio"] = len(kept) / max(1, len(plan.get("lines") or []))
              plan["policy_expression_mode"] = [
                  "原句直述", "时间提醒", "信息说明", "看车提醒", "截止时间"
              ][mode % 5]
              return plan

          def _line_plan(title, content, vehicle_model, policy):
              """先确定每一行怎么处理，再交给模型复刻，避免生成后把整篇删空。"""
              same_model = _current_model_source(title, content, vehicle_model)
              policy_facts = _policy_facts(policy)
              policy_index = 0
              plan = []
              source_lines = [line for line in str(content or "").splitlines() if line.strip()]
              for line_no, source in enumerate(source_lines, start=1):
                  clean = source.strip()
                  emoji = re.findall(r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️]", clean)
                  if clean.startswith("#"):
                      action = "REWRITE_TAGS"
                      replacement = ""
                  elif any(word in clean for word in LINE_BANNED):
                      action = "SAFE_POLICY_CLOSE" if CTA_TEMPLATE_LINE.search(clean) else "DELETE"
                      replacement = ""
                  elif POLICY_FACT_LINE.search(clean) or UNSUPPORTED_STATE_LINE.search(clean):
                      if policy_index < len(policy_facts):
                          action = "POLICY_REPLACE"
                          replacement = policy_facts[policy_index]
                          policy_index += 1
                      else:
                          action = "DELETE"
                          replacement = ""
                  elif PRODUCT_FACT_LINE.search(clean) and not same_model:
                      action = "DELETE"
                      replacement = ""
                  elif PRODUCT_FACT_LINE.search(clean) and same_model:
                      # 本流程是政策帖：同车型原文也只能借版式与语气，政策未提供的
                      # 配置、功能和体验事实同样删除，避免把车型教程混入政策正文。
                      action = "DELETE"
                      replacement = ""
                  else:
                      action = "MIN_EDIT"
                      replacement = ""
                  plan.append({
                      "line_no": line_no,
                      "action": action,
                      "source": clean,
                      "replacement": replacement,
                      "emoji": emoji,
                  })
              kept = [x for x in plan if x["action"] != "DELETE"]
              return {
                  "same_model_source": same_model,
                  "policy_facts": policy_facts,
                  "title_source": str(title or "").strip(),
                  "lines": plan,
                  "expected_output_line_count": len(kept),
                  "safe_emoji_sequence": [emoji for row in kept for emoji in row["emoji"]],
                  "delete_count": len(plan) - len(kept),
                  "editable_ratio": len(kept) / max(1, len(plan)),
              }

          def main(copy_body: str, copy_body_2: str, copy_body_3: str,
                   prompt_body: str, car_body: str, history_body: str,
                   account_name: str, brand: str, vehicle_model: str,
                   copy_keyword: str, prompt_keyword: str,
                   policy_text: str, reference_description: str,
                   run_id: str, post_count: str) -> dict:
              copy_pages = [
                  _payload(copy_body, "文案库第1页") or {},
                  _payload(copy_body_2, "文案库第2页") or {},
                  _payload(copy_body_3, "文案库第3页") or {},
              ]
              prompt_data = _payload(prompt_body, "提示词库") or {}
              car_data = _payload(car_body, "车型库") or {}

              copies = []
              for page_data in copy_pages:
                  copies.extend(list(page_data.get("items") or []))
              prompts = list(prompt_data.get("items") or [])
              images = list(car_data.get("images") or [])
              if not copies:
                  raise ValueError("当前检索条件没有找到文案库素材")
              if not prompts:
                  raise ValueError("当前检索条件没有找到提示词库素材")
              if not images:
                  raise ValueError("车型库没有找到该品牌/车型的辅助图；工作流不会换成别的车型")

              account_parts = [
                  part for part in re.split(r"[-_/|｜\\s]+", _norm(account_name))
                  if len(part) >= 2
              ]
              terms = [_norm(brand), _norm(vehicle_model),
                       _norm(copy_keyword), _norm(prompt_keyword)] + account_parts[-2:]
              terms = [t.lower() for t in terms if t]
              policy = _norm(policy_text)
              policy_markers = [
                  "试驾", "到店", "品鉴", "活动", "截止", "时间", "门店",
                  "政策", "权益", "补贴", "置换", "金融", "购车", "锁单", "交付"
              ]
              active_policy_markers = [marker for marker in policy_markers if marker in policy]
              policy_marker_weights = {
                  "试驾": 8, "品鉴": 8, "到店": 5, "截止": 4, "时间": 3,
                  "门店": 3, "活动": 2, "政策": 2, "权益": 2, "补贴": 3,
                  "置换": 4, "金融": 4, "购车": 2, "锁单": 3, "交付": 3,
              }
              required_topic_groups = []
              if "试驾" in policy or "品鉴" in policy:
                  required_topic_groups.append(("试驾", "品鉴"))
              if "到店" in policy or "门店" in policy:
                  required_topic_groups.append(("到店", "进店", "门店"))
              if "活动" in policy:
                  required_topic_groups.append(("活动",))
              if "截止" in policy or "时间" in policy:
                  required_topic_groups.append(("截止", "截至", "时间", "期限"))
              feature_markers = [
                  "续航", "智驾", "智能驾驶", "座椅", "底盘", "动力", "加速",
                  "空间", "车机", "配置", "悬架", "电池", "内饰", "外观", "操控"
              ]
              automotive_markers = [
                  "汽车", "车型", "新车", "看车", "试驾", "购车", "提车", "用车",
                  "车主", "门店", "SUV", "轿车", "新能源", "纯电", "增程"
              ]
              hard_banned_markers = [
                  "私信", "加微信", "微信号", "扫码", "电话", "站外引流",
                  "白嫖", "白送", "送你", "赠送", "免费", "发你", "评论区", "评论",
                  "国旗", "国家", "薅", "崩", "秒发", "底价", "全网最低",
                  "最便宜", "抄底", "闭眼", "直降", "下调", "跳水", "割韭菜", "冲量"
                  ,"夯爆", "太香", "香爆", "神车"
              ]
              aggressive_markers = [
                  "内部", "隐藏福利", "冲", "错过", "收回", "优惠拉满", "省下一笔",
                  "报价单", "纯净落地", "全盘托出", "信息差", "套路"
              ]
              cta_markers = [
                  "留言", "咨询", "点击", "一对一", "预约", "领取", "解锁", "进群",
                  "加好友", "联系方式", "报车型", "溜【", "回复", "获取"
              ]
              commercial_markers = [
                  "价格", "报价", "好价", "优惠", "福利", "权益", "补贴", "金融", "首付",
                  "月供", "免息", "利息", "锁单", "下定", "提车价", "落地价", "价表",
                  "指导价", "万元", "元"
              ]
              tangential_markers = [
                  "轮胎", "车胎", "机油", "洗车", "养车", "车险", "保险", "维修",
                  "保养", "二手车", "事故车", "改装件", "行车记录仪", "非机动车",
                  "电动车", "摩托车", "交通法规", "管理条例", "梗图", "鼠标",
                  "magic mouse", "手机", "电脑", "甲醛", "异味", "炭包", "臭氧",
                  "光触媒", "香薰", "果皮", "公路", "道路", "路面", "轴承重",
                  "重型大货车", "车轴", "压坏"
              ]
              detailed_title_markers = [
                  "按键", "功能", "配置", "续航", "空间", "智驾", "智能驾驶", "性能",
                  "动力", "底盘", "座椅", "电池", "落地", "价格", "报价", "权益", "补贴"
              ]
              news_markers = [
                  "据悉", "据报道", "记者", "警方", "消防", "事故", "案件", "伤亡",
                  "发布会", "销量", "交付量", "同比", "环比", "通报", "热搜", "网友说"
              ]
              policy_has_commercial_fact = any(marker in policy for marker in commercial_markers)
              policy_has_amount = bool(re.search(r"\d+(?:\.\d+)?\s*(?:元|万元|万|%)", policy))
              seed = sum(ord(ch) for ch in str(run_id or ""))

              target_count = max(1, min(5, int(post_count or 1)))
              # 一次多准备不同母版候选，硬校验从中选满目标数量，避免挡掉一篇就少一篇。
              # 单篇也准备 3 个不同母版候选：一个结构损坏或触发硬禁词时，
              # 工作流仍能在本次运行内自动选择其余候选，不依赖人工重跑。
              count = min(8, max(target_count * 2, target_count + 2, 3))
              history_data = _payload(history_body, "近期生产历史") or {}
              recent_primary_ids = set()
              recent_content_hashes = set()
              for task in list(history_data.get("items") or []):
                  request_id = _norm(task.get("client_request_id"))
                  match = re.match(r"xhs-p(\d+)-c([0-9a-f]{12})-", request_id)
                  if match:
                      recent_primary_ids.add(match.group(1))
                      recent_content_hashes.add(match.group(2))
              copy_pool = []
              seen_exact = set()
              for idx, item in enumerate(copies):
                  title = _norm(item.get("title"))
                  content = _norm(item.get("content"))
                  haystack = (title + "\n" + content + "\n" + _norm(item.get("category"))).lower()
                  if "a01" in haystack:
                      continue
                  if len(content) < 30:
                      continue
                  exact_key = re.sub(r"\s+", "", title + content).lower()
                  if exact_key in seen_exact:
                      continue
                  seen_exact.add(exact_key)
                  record = {
                      "id": item.get("id"),
                      "title": title,
                      "content": content[:1600],
                      "tags": item.get("tags") or [],
                      "category": item.get("category") or ""
                  }
                  topical = sum(1 for term in terms if term in haystack)
                  quality = min(len(content), 900) / 900
                  line_count = len([line for line in content.splitlines() if line.strip()])
                  policy_hits = sum(
                      policy_marker_weights.get(marker, 1)
                      for marker in active_policy_markers if marker in content
                  )
                  topic_group_hits = sum(
                      1 for group in required_topic_groups
                      if any(keyword in content for keyword in group)
                  )
                  mandatory_trial_match = not any(x in policy for x in ("试驾", "品鉴")) or any(
                      x in content for x in ("试驾", "品鉴")
                  )
                  feature_hits = sum(1 for marker in feature_markers if marker in content and marker not in policy)
                  body_without_topic_tags = "\n".join(
                      line for line in content.splitlines() if not line.lstrip().startswith("#")
                  ).lower()
                  # 话题标签中的“汽车”不能把梗图、法规或电子产品内容伪装成可用汽车母版。
                  automotive_hits = sum(1 for marker in automotive_markers if marker.lower() in body_without_topic_tags)
                  news_hits = sum(1 for marker in news_markers if marker in content)
                  hard_banned_hits = sum(1 for marker in hard_banned_markers if marker in content)
                  aggressive_hits = sum(1 for marker in aggressive_markers if marker in content)
                  semantic_banned_hits = 1 if POLICY_OUTPUT_SEMANTIC.search(content) else 0
                  title_hard_banned_hits = sum(
                      1 for marker in hard_banned_markers + aggressive_markers + cta_markers
                      if marker in title
                  )
                  title_commercial_hits = sum(1 for marker in commercial_markers if marker in title)
                  tangential_hits = sum(1 for marker in tangential_markers if marker in haystack)
                  detail_title_hits = sum(1 for marker in detailed_title_markers if marker in title)
                  title_date_tokens = re.findall(
                      r"20\d{2}年|\d{1,2}\s*月|\d{1,2}\s*日|(?:一|二|三|四|五|六|七|八|九|十|十一|十二)月",
                      title,
                  )
                  title_amount_tokens = re.findall(r"\d+(?:\.\d+)?\s*(?:元|万元|万|%)", title)
                  title_policy_conflict = any(token not in policy for token in title_date_tokens + title_amount_tokens)
                  title_policy_terms = [
                      marker for marker in [
                          "新政", "福利", "权益", "补贴", "金融", "价格", "报价", "好价",
                          "落地价", "月供", "免息", "零首付", "上线", "已确认", "上市"
                      ] if marker in title
                  ]
                  if any(marker not in policy for marker in title_policy_terms):
                      title_policy_conflict = True
                  if UNSUPPORTED_STATE_LINE.search(title) and UNSUPPORTED_STATE_LINE.search(title).group(0) not in policy:
                      title_policy_conflict = True
                  numeric_tokens = len(re.findall(r"\d+(?:\.\d+)?", content))
                  numeric_mismatch = numeric_tokens if not re.search(r"\d", policy) else max(0, numeric_tokens - 4)
                  structure_units = len(re.findall(
                      r"(?:^|\n|\s)(?:\d{1,2}[.、]|[一二三四五六七八九十]+[、.])",
                      content,
                  ))
                  nonempty_lines = [line for line in content.splitlines() if line.strip()]
                  body_line_count = sum(
                      1 for line in nonempty_lines
                      if not line.lstrip().startswith("#")
                  )
                  unsafe_lines = 0
                  for line in nonempty_lines:
                      unsafe = (
                          any(marker in line for marker in hard_banned_markers)
                          or any(marker in line for marker in aggressive_markers)
                          or any(marker in line for marker in cta_markers)
                          or any(marker in line for marker in feature_markers if marker not in policy)
                          or (not policy_has_commercial_fact and any(marker in line for marker in commercial_markers))
                      )
                      if unsafe:
                          unsafe_lines += 1
                  retention_ratio = 1 - unsafe_lines / max(1, len(nonempty_lines))
                  length_penalty = (
                      max(0, line_count - 10) * 1.0
                      + max(0, structure_units - 8) * 1.5
                  )
                  adaptability = (
                      policy_hits * 2.4
                      - feature_hits * 1.1
                      - hard_banned_hits * 12
                      - aggressive_hits * 3
                      - semantic_banned_hits * 18
                      - numeric_mismatch * 0.35
                      - length_penalty
                      + retention_ratio * 15
                  )
                  line_plan = _line_plan(title, content, vehicle_model, policy)
                  plan_score = (
                      line_plan["editable_ratio"] * 30
                      + (18 if line_plan["same_model_source"] else 0)
                      + min(topic_group_hits, 3) * 2
                      - news_hits * 15
                      - max(0, body_line_count - 14) * 2
                      - (28 if POLICY_FACT_LINE.search(title) and not POLICY_FACT_LINE.search(policy) else 0)
                  )
                  copy_pool.append({
                      "record": record,
                      "profile": _style_profile(content),
                      "quality": quality,
                      "topical": topical,
                      "preference_hit": bool(
                          _norm(copy_keyword)
                          and _norm(copy_keyword).lower() in haystack
                      ),
                      "policy_hits": policy_hits,
                      "topic_group_hits": topic_group_hits,
                      "mandatory_trial_match": mandatory_trial_match,
                      "automotive_hits": automotive_hits,
                      "news_hits": news_hits,
                      "feature_hits": feature_hits,
                      "numeric_tokens": numeric_tokens,
                      "hard_banned_hits": hard_banned_hits,
                      "title_hard_banned_hits": title_hard_banned_hits,
                      "aggressive_hits": aggressive_hits,
                      "semantic_banned_hits": semantic_banned_hits,
                      "title_commercial_hits": title_commercial_hits,
                      "tangential_hits": tangential_hits,
                      "detail_title_hits": detail_title_hits,
                      "title_policy_conflict": title_policy_conflict,
                      "retention_ratio": retention_ratio,
                      "adaptability": adaptability,
                      "body_line_count": body_line_count,
                      "structure_units": structure_units,
                      "line_plan": line_plan,
                      "plan_score": plan_score,
                      "jitter": _stable_jitter(run_id, item.get("id", idx)),
                  })
              if len(copy_pool) < count * 4:
                  raise ValueError("可用文案不足 %s 条，无法为每篇分配 4 条不重复原文" % (count * 4))

              # 先按逐行执行计划筛选母版，而不是要求原文主题与政策完全相同。
              # 同车型原文可保留其产品事实；跨车型原文只保留安全的结构、语气和通用句。
              primary_pool = [
                  row for row in copy_pool
                  if row["news_hits"] == 0
                  and row["hard_banned_hits"] == 0
                  and row["aggressive_hits"] == 0
                  and row["semantic_banned_hits"] == 0
                  and row["tangential_hits"] == 0
                  and row["automotive_hits"] >= 1
                  and not row["title_policy_conflict"]
                  and (policy_has_commercial_fact or row["title_commercial_hits"] == 0)
                  and row["detail_title_hits"] == 0
                  and row["retention_ratio"] >= 0.68
                  and 2 <= row["body_line_count"] <= 16
                  and row["structure_units"] <= 12
                  and row["line_plan"]["expected_output_line_count"] >= 4
                  and bool(row["line_plan"]["safe_emoji_sequence"])
                  and row["line_plan"]["editable_ratio"] >= 0.58
              ]
              if len(primary_pool) < count:
                  primary_pool = [
                      row for row in copy_pool
                      if row["news_hits"] == 0
                      and row["hard_banned_hits"] == 0
                      and row["semantic_banned_hits"] == 0
                      and row["tangential_hits"] == 0
                      and row["automotive_hits"] >= 1
                      and not row["title_policy_conflict"]
                      and (policy_has_commercial_fact or row["title_commercial_hits"] == 0)
                      and row["detail_title_hits"] == 0
                      and row["retention_ratio"] >= 0.52
                      and 2 <= row["body_line_count"] <= 18
                      and row["line_plan"]["expected_output_line_count"] >= 4
                      and bool(row["line_plan"]["safe_emoji_sequence"])
                      and row["line_plan"]["editable_ratio"] >= 0.48
                  ]
              same_model_primary_pool = [
                  row for row in primary_pool if row["line_plan"]["same_model_source"]
              ]
              if len(same_model_primary_pool) < count:
                  same_model_primary_pool = [
                      row for row in copy_pool
                      if row["line_plan"]["same_model_source"]
                      and row["news_hits"] == 0
                      and row["tangential_hits"] == 0
                      and row["automotive_hits"] >= 1
                      and row["title_hard_banned_hits"] == 0
                      and row["detail_title_hits"] == 0
                      and row["semantic_banned_hits"] == 0
                      and not row["title_policy_conflict"]
                      and (policy_has_commercial_fact or row["title_commercial_hits"] == 0)
                      and 2 <= row["body_line_count"] <= 18
                      and row["line_plan"]["expected_output_line_count"] >= 4
                      and bool(row["line_plan"]["safe_emoji_sequence"])
                      and row["line_plan"]["editable_ratio"] >= 0.42
                      and row["retention_ratio"] >= 0.35
                  ]
              # 同车型标题安全、正文能逐行净化时，优先使用该池；旧政策和互动句在
              # line_plan 中删除或替换。全车型文案仍作为 3 条辅参考提供少量话术。
              if len(same_model_primary_pool) >= max(count * 4, 8):
                  # 同车型母版优先，但不再排斥其它车型的安全母版。用户要求可参考
                  # 全车型文案库；保留跨车型候选也能避免单车型长期锁死同一结构。
                  primary_pool = same_model_primary_pool + [
                      row for row in primary_pool if row not in same_model_primary_pool
                  ]
              elif len(primary_pool) < count:
                  raise ValueError("文案库中可逐行安全复刻的不同母版不足 %s 条" % count)
              if _norm(copy_keyword):
                  preference_primary_pool = [
                      row for row in primary_pool if row["preference_hit"]
                  ]
                  if len(preference_primary_pool) >= count:
                      primary_pool = preference_primary_pool
              primary_pool = sorted(
                  primary_pool,
                  key=lambda row: -(
                      row["plan_score"] * 2.2
                      + row["quality"]
                      + min(row["topical"], 3) * 4.0
                      + row["jitter"] * 0.15
                  ),
              )[:min(260, len(primary_pool))]
              fresh_primary_pool = [
                  row for row in primary_pool
                  if str(row["record"].get("id")) not in recent_primary_ids
              ]
              history_fallback_count = 0
              if len(fresh_primary_pool) >= count:
                  primary_pool = fresh_primary_pool
              else:
                  history_fallback_count = count - len(fresh_primary_pool)
                  primary_pool = fresh_primary_pool + [
                      row for row in primary_pool
                      if str(row["record"].get("id")) in recent_primary_ids
                  ]
              primaries = []
              # 首篇按运行 ID 与调用方差异共同轮换；并发请求只要输入略有变化，
              # 就会主动分流到不同母版，而不是只靠运行 ID 碰运气。
              first_window = primary_pool[:min(len(primary_pool), 90)]
              rotation_key = "|".join([
                  str(run_id or "fallback"),
                  _norm(account_name),
                  _norm(copy_keyword),
                  _norm(prompt_keyword),
                  _norm(reference_description),
              ])
              rotation_hash = int(
                  hashlib.sha256(rotation_key.encode("utf-8")).hexdigest()[:12], 16
              )
              rotation_offset = rotation_hash % len(first_window)
              first = first_window[rotation_offset]
              primaries.append(first)
              while len(primaries) < count:
                  remaining = [row for row in primary_pool if row not in primaries]
                  chosen = max(
                      remaining,
                      key=lambda row: (
                          min(_style_distance(row["profile"], picked["profile"]) for picked in primaries) * 5
                          + row["plan_score"] * 1.6
                          + row["quality"] * 0.6
                          + row["jitter"] * 0.1
                      ),
                  )
                  primaries.append(chosen)

              # 每篇再配 3 条全批次不重复的辅参考；主参考始终位于本组第 1 条。
              used_ids = {str(row["record"].get("id")) for row in primaries}
              assignments = []
              selected_copies = []
              for slot, primary in enumerate(primaries, start=1):
                  support_pool = [
                      row for row in copy_pool
                      if str(row["record"].get("id")) not in used_ids and row["hard_banned_hits"] == 0
                  ]
                  if len(support_pool) < 3:
                      support_pool = [
                          row for row in copy_pool
                          if str(row["record"].get("id")) not in used_ids
                      ]
                  supports = sorted(
                      support_pool,
                      key=lambda row: -(
                          _style_distance(primary["profile"], row["profile"]) * 2
                          + row["quality"]
                          + row["jitter"] * 0.2
                      ),
                  )[:3]
                  for row in supports:
                      used_ids.add(str(row["record"].get("id")))
                  group = [primary["record"]] + [row["record"] for row in supports]
                  selected_copies.extend(group)
                  expression_index = (rotation_hash + slot - 1) % 5
                  styled_line_plan = _line_plan_with_policy_style(
                      primary["line_plan"], policy, vehicle_model, expression_index
                  )
                  assignments.append(json.dumps({
                      "slot": slot,
                      "locked_primary": group[0],
                      "line_plan": styled_line_plan,
                      "policy_expression_mode": styled_line_plan["policy_expression_mode"],
                      "locked_line_count": styled_line_plan["expected_output_line_count"],
                      "locked_emoji_sequence": styled_line_plan["safe_emoji_sequence"],
                      "support_references": group[1:],
                      "source_copy_ids": [item.get("id") for item in group],
                      "instruction": "严格执行 line_plan：MIN_EDIT/KEEP_SOURCE_FACT 保持原行；母版中的⬇️、👇、👉、💬、📩及【城市＋车型】属于允许保留的符号承接，不是敏感文字；POLICY_REPLACE 使用本帖指定的等义表达，SAFE_POLICY_CLOSE 必须逐字使用replacement保留符号承接与原位置，DELETE 不输出，REWRITE_TAGS 仅换安全话题；政策事实不变，但本批各帖表达方式不得相同；不得自行增行",
                  }, ensure_ascii=False))

              visual_terms = [
                  "湖", "湖畔", "静水", "倒影", "镜面", "远山", "薄雾", "公路",
                  "城市", "建筑", "草地", "山林", "海边", "天空", "晚霞", "黄昏",
                  "粉蓝", "蜜桃粉", "渐变", "黑色", "白色", "纯侧面", "侧面",
                  "正面", "斜前", "居中", "左对齐", "右对齐", "大标题", "副标题",
                  "小字", "三层", "三行", "留白", "极简", "轻奢", "黑金"
              ]
              reference_text = _norm(reference_description).lower()
              active_visual_terms = [term for term in visual_terms if term.lower() in reference_text]

              ranked_prompts = []
              for idx, item in enumerate(prompts):
                  chinese = _norm(item.get("chinese"))
                  english = _norm(item.get("english"))
                  title = _norm(item.get("title") or item.get("name"))
                  haystack = (title + "\n" + chinese + "\n" + english + "\n" + _norm(item.get("category"))).lower()
                  score = sum(4 for term in terms if term in haystack)
                  score += 2 if _norm(item.get("image_url")) else 0
                  # 参考图说明中的构图、场景、色彩和文字层级优先于泛化的“汽车”关键词。
                  score += sum(9 for term in active_visual_terms if term.lower() in haystack)
                  prompt_price_hits = len(re.findall(
                      r"原价|现价|指导价|裸车价|落地价|优惠|补贴|权益|金额|价表|价格表|"
                      r"\d+(?:\.\d+)?\s*(?:元|万元|万|%)",
                      chinese + "\n" + title,
                  ))
                  if not policy_has_amount:
                      score -= min(120, prompt_price_hits * 18)
                  score += ((idx + seed) % 19) / 100
                  ranked_prompts.append((score, idx, {
                      "id": item.get("id"),
                      "title": title,
                      "chinese": chinese[:1400],
                      "english": english[:1400],
                      "image_url": _norm(item.get("image_url")),
                      "category": item.get("category") or "",
                      "param_type": item.get("param_type") or ""
                  }))
              ranked_prompts.sort(key=lambda row: (-row[0], (row[1] + seed) % 101))
              # 视觉分析只需要高相关候选；限制为 15 条，避免无参考图时把大段提示词
              # 全量送入模型造成响应过慢，同时仍保留足够的版式选择空间。
              selected_prompts = [row[2] for row in ranked_prompts[:10]]

              clean_images = []
              for image in images:
                  url = _norm(image.get("url"))
                  if url:
                      clean_images.append({
                          "label": _norm(image.get("label")),
                          "url": url,
                          "model": _norm(image.get("model")) or _norm(vehicle_model)
                      })
              if not clean_images:
                  raise ValueError("车型库记录存在，但没有可用图片 URL")

              trace = {
                  "copy_pages": [page.get("page") for page in copy_pages],
                  "copy_total": max([int(page.get("total") or 0) for page in copy_pages] or [0]),
                  "copy_loaded": len(copies),
                  "copy_candidate_ids": [item.get("id") for item in selected_copies],
                  "locked_primary_ids": [row["record"].get("id") for row in primaries],
                  "copy_selection_strategy": "preference-enforced-relevance-gated-v8.5",
                  "target_count": target_count,
                  "candidate_count": count,
                  "recent_primary_ids_excluded": sorted(recent_primary_ids),
                  "recent_content_hashes_loaded": len(recent_content_hashes),
                  "history_fallback_count": history_fallback_count,
                  "primary_rotation_window": len(first_window),
                  "primary_rotation_offset": rotation_offset,
                  "prompt_page": prompt_data.get("page"),
                  "prompt_total": prompt_data.get("total"),
                  "prompt_candidate_ids": [item.get("id") for item in selected_prompts],
                  "vehicle_image_count": len(clean_images)
              }
              return {
                  "copy_assignments": assignments,
                  "copy_candidates_json": json.dumps(selected_copies, ensure_ascii=False),
                  "prompt_candidates_json": json.dumps(selected_prompts, ensure_ascii=False),
                  "vehicle_images_json": json.dumps(clean_images, ensure_ascii=False),
                  "library_trace_json": json.dumps(trace, ensure_ascii=False)
              }
