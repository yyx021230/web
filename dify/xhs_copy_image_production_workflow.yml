              ,(r"(?:懂的|想看的|想了解的|想知道的|需要的|感兴趣的).{0,8}(?:来|集合|报到|举手|找|问|聊|留言|回复|说)", "疑似互动召集或咨询引导")
              ,(r"(?:来|一起).{0,4}(?:聊聊|聊一聊|交流|讨论)|(?:有问题|有疑问).{0,8}(?:找|问|聊|留言|回复)", "疑似交流或咨询引导")
              ,(r"(?:下方|下面|文末|主页).{0,8}(?:留言|回复|评论|找|联系|看)|(?:留言|回复|评论).{0,8}(?:告诉|说|交流|讨论)", "疑似平台互动引导")
              ,(r"(?<![抵折])(?:扣|打|敲).{0,3}(?:1|数字|公屏)|(?:蹲|报到|举手|集合)(?:一下|一个|一波|等)?", "疑似互动口令或召集")
              ,(r"(?:戳|敲|滴|call).{0,3}(?:我|一下)|@\S+|艾特.{0,8}(?:朋友|车友|家人|同事)", "疑似变体联系或艾特传播")
              ,(r"(?:点|求).{0,3}(?:赞|关注|收藏)|关注.{0,6}(?:我|账号|主页)|收藏.{0,5}(?:备用|起来|一下)", "疑似点赞关注收藏引导")
              ,(r"(?:一个一个|一个个|逐个|挨个|统一|都给).{0,3}回", "疑似承诺逐一回复")
              ,(r"月薪.{0,8}(?:轻松|也能).{0,8}(?:拥有|入手)|人人都能.{0,6}(?:拥有|入手)|轻松(?:拥有|入手)", "疑似无依据的购车负担承诺")
              ,(r"被问.{0,8}链接|要链接|求链接", "疑似链接或站外引导")
              ,(r"最高标准|辨识度拉满|实力拉满|操作丝滑|顶级(?:配置|体验|享受)|完美(?:适配|解决)", "疑似绝对化或夸张体验表述")
              ,(r"保费|高枕无忧|致命误区|不保|坏个.{0,6}零件|过了\s*\d+\s*年.{0,8}质保", "疑似保险或质保模板残留")
          ]
          UNSUPPORTED_FEATURES = re.compile(
