          max_read_timeout: 60
          max_write_timeout: 20
        title: 登录线上服务
        type: http-request
        url: '{{#env.BACKEND_BASE_URL#}}/auth/login'
        variables: []
      height: 154
      id: login
      position:
        x: 370
        y: 300
      positionAbsolute:
        x: 370
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 270
    - data:
        code: |-
          import json

          def main(body: str, status_code: int) -> dict:
              if int(status_code or 0) < 200 or int(status_code or 0) >= 300:
                  raise ValueError("线上服务登录失败，请检查 BACKEND_BASE_URL、用户名和密码")
              try:
                  payload = json.loads(body or "{}")
              except Exception as exc:
                  raise ValueError("登录接口没有返回 JSON") from exc
              token = str(payload.get("access_token") or "").strip()
              if not token:
                  raise ValueError("登录响应中没有 access_token")
              return {"token": token}
        code_language: python3
        desc: 提取 Bearer Token；登录失败时立即终止。
        outputs:
          token:
            children: null
            type: string
        selected: false
