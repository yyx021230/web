              r"全国.{0,6}门店|各地.{0,6}门店|试驾礼|礼品|礼遇|领取.{0,8}(?:礼|权益)|"
              r"智能驾驶|智驾|驾控|操控|未来出行|生活方式"
          )
          UNSUPPORTED_STATUS = re.compile(
              r"活动.{0,8}(?:(?:已经|已|正在)(?:开始|开启|上线|落地|启动|开展|安排|确认)|进行中|正在进行)|"
              r"(?:(?:已经|已|正在)(?:开始|开启|上线|落地|启动|开展|安排|确认)|进行中|正在进行).{0,8}活动|"
              r"今日正式上市|今日上市|刚刚上市|正式上市|如约而至|(?:权益|政策|活动)信息已同步更新|同步更新|"
              r"月底行情|月末行情|行情.{0,4}(?:大调整|调整)|大调整|真实落地价|第[一二三四]季度购车新规"
          )
          UNSUPPORTED_COPY_CLAIMS = re.compile(
              r"安全感|更安心|安全座驾|贴心代步|代步车|开起来.{0,8}顺不顺手|"
              r"家用\s*SUV|关注度.{0,6}(?:高|很高)|体验.{0,8}(?:一下|不错|很好)|"
              r"白跑一趟|跑冤枉路|跑空|更方便.{0,8}行程|更从容|"
              r"适合谁|日常通勤|周末出行|家庭(?:出行|用户|用车)?|好开|好停|"
              r"首台新能源|补能|小尺寸|SUV|轿车|轿跑|两厢|三厢|六座|七座|"
              r"全尺寸|中大型|旗舰(?:车型|SUV|定位|级)?"
          )
          UNSUPPORTED_PRICE_LAYOUT = re.compile(
              r"原价|现价|划线价|价格表|价格突出|裸车价|落地价|报价|优惠价|指导价|补贴价|\d+(?:\.\d+)?\s*(?:元|万元|万)|\d+(?:\.\d+)?\s*%"
          )
          NO_AMOUNT_POLICY = re.compile(
              r"(?:没有|未|不曾)(?:提供|给出|明确).{0,18}(?:价格|金额|补贴|权益|首付|利率|月供|数字|数值)|不得新增.{0,18}(?:价格|金额|补贴|权益|数字|数值)"
          )
          NO_SCENE_CHANGE = re.compile(r"保持不变|背景不变|场景不变|没有变化|无需变化|未做变化")
          META_MARKETING_CLAUSE = re.compile(
              r"[^，,；;。\n]{0,40}(?:引流|导流|留资|获客|线索转化|联系方式)[^，,；;。\n]{0,40}[，,；;。]?"
          )
          INTERACTION_TRIGGER = re.compile(
              r"转发|分享给|分享出去|分享一下|发给.{0,10}(?:朋友|车友|家人|同事|身边)|"
              r"留言|回复|评论|蹲一个|蹲蹲|扣数字|打在公屏|告诉我|说说看|"
              r"(?:懂的|想看的|想了解的|想知道的|需要的|感兴趣的).{0,8}(?:来|集合|报到|举手|找|问|聊|留言|回复|说)|"
              r"(?:来|一起).{0,4}(?:聊聊|聊一聊|交流|讨论)|(?:有问题|有疑问).{0,8}(?:找|问|聊|留言|回复)|"
              r"(?:戳|敲|滴|call).{0,3}(?:我|一下)|艾特.{0,8}(?:朋友|车友|家人|同事)|@\S+|"
              r"(?:点|求).{0,3}(?:赞|关注|收藏)|关注.{0,6}(?:我|账号|主页)|收藏.{0,5}(?:备用|起来|一下)|"
              r"一键三连|点赞|点个赞|找我|问我|来聊|敲我|滴我",
              flags=re.I,
          )

          # “一个一个回”不含“回复”二字，但语义完全相同，也必须删除。
          INTERACTION_TRIGGER = re.compile(
              INTERACTION_TRIGGER.pattern + r"|(?:一个一个|一个个|逐个|挨个|统一|都给).{0,3}回",
              flags=re.I,
          )

          def _strip_interaction_clauses(value):
              """终审偶发漏删时，只删除互动分句，不重写其余内容。"""
              cleaned_lines = []
              for raw_line in str(value or "").splitlines():
                  line = raw_line.strip()
                  if not line:
                      cleaned_lines.append("")
                      continue
                  parts = re.split(r"([。！？!?；;])", line)
                  kept = []
                  for idx in range(0, len(parts), 2):
                      clause = parts[idx].strip()
                      punctuation = parts[idx + 1] if idx + 1 < len(parts) else ""
                      if not clause or INTERACTION_TRIGGER.search(clause):
                          continue
                      kept.append(clause + punctuation)
                  merged = "".join(kept).strip()
                  if merged:
                      cleaned_lines.append(merged)
              return "\n".join(cleaned_lines).strip()

          def _strip_banned_copy_clauses(value):
              """正文按分句删除绝对禁用词，避免只删词后留下病句。"""
              cleaned_lines = []
              for raw_line in str(value or "").splitlines():
                  parts = re.split(r"([。！？!?；;])", raw_line.strip())
                  kept = []
                  for idx in range(0, len(parts), 2):
                      clause = parts[idx].strip()
                      punctuation = parts[idx + 1] if idx + 1 < len(parts) else ""
                      if not clause or any(word in clause for word in BANNED):
                          continue
                      kept.append(clause + punctuation)
                  merged = "".join(kept).strip()
                  if merged:
                      cleaned_lines.append(merged)
              return "\n".join(cleaned_lines).strip()

          def _strip_unsupported_copy_clauses(value, policy):
              cleaned_lines = []
              for raw_line in str(value or "").splitlines():
                  parts = re.split(r"([。！？!?；;])", raw_line.strip())
                  kept = []
                  for idx in range(0, len(parts), 2):
                      clause = parts[idx].strip()
                      punctuation = parts[idx + 1] if idx + 1 < len(parts) else ""
                      match = UNSUPPORTED_COPY_CLAIMS.search(clause)
                      if not clause or (match and match.group(0) not in str(policy or "")):
                          continue
                      kept.append(clause + punctuation)
                  merged = "".join(kept).strip()
                  if merged:
                      cleaned_lines.append(merged)
              return "\n".join(cleaned_lines).strip()

          def _remove_banned_tokens(value):
              """标题和长生图提示词不宜整句删除，只移除确定禁用 token。"""
              text = str(value or "")
              for word in sorted(BANNED, key=len, reverse=True):
                  text = text.replace(word, "")
              return re.sub(r"[，,；;。]{2,}", "；", text).strip(" ，,；;。")

          def _normalize_repeat_unit(text):
              value = str(text or "").strip()
              value = re.sub(r"#[^#\n]+(?:\[话题\])?#", "", value)
              value = re.sub(r"20\d{2}年\d{1,2}月\d{1,2}日|\d+(?:\.\d+)?", "数字", value)
              value = re.sub(r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️♻️💳—\-\s，。！？、,.!~～：:；;（）()]", "", value)
              return value

          def _internal_repetition_reasons(content, policy):
              reasons = []
              lines = [line.strip() for line in str(content or "").splitlines() if line.strip()]
              body_lines = [line for line in lines if not line.startswith("#")]
              normalized = [_normalize_repeat_unit(line) for line in body_lines]
              normalized = [line for line in normalized if len(line) >= 6]
              counts = {}
              for line in normalized:
                  counts[line] = counts.get(line, 0) + 1
              duplicates = [line for line, count in counts.items() if count >= 2]
              if duplicates:
                  reasons.append("单篇内部存在重复或仅改标点的句子")

              # 政策事实可以出现于标题/正文各一次，但不得把同一句政策当作
              # 多个段落的填充内容反复复述。
              policy_parts = [
                  _normalize_repeat_unit(part)
                  for part in re.split(r"[。；;\n]+", str(policy or ""))
                  if len(_normalize_repeat_unit(part)) >= 8
              ]
              for part in policy_parts:
                  hits = sum(1 for line in normalized if part in line or line in part)
                  if hits > 1:
                      reasons.append("同一政策事实在正文中重复超过 1 次")
                      break

              raw_policy_parts = [
                  part.strip(" ，,。；;：:")
                  for part in re.split(r"[。；;\n]+", str(policy or ""))
                  if len(part.strip(" ，,。；;：:")) >= 8
              ]
              if any(str(content or "").count(part) > 1 for part in raw_policy_parts):
                  if "同一政策事实在正文中重复超过 1 次" not in reasons:
                      reasons.append("同一政策事实在正文中重复超过 1 次")

              if len(normalized) >= 5:
                  unique_ratio = len(set(normalized)) / len(normalized)
                  if unique_ratio < 0.78:
                      reasons.append("单篇有效句去重率过低")
              return reasons

          def _dedupe_content(content, policy):
              """删除模型偶发重复行，以及第三次起重复出现的完整政策事实。"""
              policy_units = [
                  _normalize_repeat_unit(part)
                  for part in re.split(r"[。；;\n]+", str(policy or ""))
                  if len(_normalize_repeat_unit(part)) >= 8
              ]
              policy_hits = {unit: 0 for unit in policy_units}
              date_tokens = list(dict.fromkeys(re.findall(
                  r"20\d{2}年\d{1,2}月\d{1,2}日|20\d{2}年|\d{1,2}月\d{1,2}日",
                  str(policy or ""),
              )))
              date_hits = {token: 0 for token in date_tokens}
              gate_seen = False
              policy_markers = ("试驾", "到店", "门店", "活动", "截止", "时间", "安排", "公布", "核验")
              seen = set()
              seen_policy_lines = []
              kept = []
              for raw_line in str(content or "").splitlines():
                  line = raw_line.strip()
                  if not line:
                      kept.append("")
                      continue
                  normalized = _normalize_repeat_unit(line)
                  if len(normalized) >= 6 and normalized in seen:
                      continue
                  repeated_exact_fact = False
                  for token in date_tokens:
                      if token in line:
                          date_hits[token] += 1
                          if date_hits[token] > 1:
                              repeated_exact_fact = True
                              break
                  has_gate_fact = "门店公布" in line and "现场核验" in line
                  if has_gate_fact and gate_seen:
                      repeated_exact_fact = True
                  elif has_gate_fact:
                      gate_seen = True
                  if repeated_exact_fact:
                      continue
                  marker_hits = sum(1 for marker in policy_markers if marker in line)
                  if marker_hits >= 2:
                      if any(SequenceMatcher(None, normalized, previous).ratio() >= 0.68 for previous in seen_policy_lines):
                          continue
                      seen_policy_lines.append(normalized)
                  repeats_policy = False
                  for unit in policy_units:
                      if unit in normalized or normalized in unit:
                          policy_hits[unit] += 1
                          if policy_hits[unit] > 1:
                              repeats_policy = True
                              break
                  if repeats_policy:
                      continue
                  if len(normalized) >= 6:
                      seen.add(normalized)
                  kept.append(line)
              return "\n".join(kept).strip()

          def _restore_emoji_positions(content, original_content):
              """按主参考行号补回终审误删的 emoji，不改句子或排版骨架。"""
              emoji_pattern = r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️]"
              original_lines = [line for line in str(original_content or "").splitlines() if line.strip()]
              draft_lines = [line for line in str(content or "").splitlines() if line.strip()]
              for index in range(min(len(original_lines), len(draft_lines))):
                  expected = re.findall(emoji_pattern, original_lines[index])
                  current = re.findall(emoji_pattern, draft_lines[index])
                  missing = list(expected)
                  for emoji in current:
                      if emoji in missing:
                          missing.remove(emoji)
                  if missing:
                      draft_lines[index] = draft_lines[index].rstrip() + "".join(missing)
              expected_all = re.findall(emoji_pattern, str(original_content or ""))
              current_all = re.findall(emoji_pattern, "\n".join(draft_lines))
              remaining = list(expected_all)
              for emoji in current_all:
                  if emoji in remaining:
                      remaining.remove(emoji)
              if draft_lines and remaining:
                  # 行数发生合规删减时，按原文相对位置补回漏掉的 emoji。
                  for emoji in remaining:
                      original_index = next(
                          (idx for idx, line in enumerate(original_lines) if emoji in line),
                          len(original_lines) - 1,
                      )
                      target_index = min(
                          len(draft_lines) - 1,
                          round(original_index * max(1, len(draft_lines) - 1) / max(1, len(original_lines) - 1)),
                      )
                      draft_lines[target_index] = draft_lines[target_index].rstrip() + emoji
              return "\n".join(draft_lines).strip()

          def _parse_json(text):
              raw = str(text or "").strip()
              raw = re.sub(r"^```(?:json)?\s*", "", raw, flags=re.I)
              raw = re.sub(r"\s*```$", "", raw)
              return json.loads(raw)

          def _text(value):
              if isinstance(value, (dict, list)):
                  return json.dumps(value, ensure_ascii=False)
              return str(value or "")

          SOURCE_PRODUCT_FACT = re.compile(
              r"续航|智驾|智能驾驶|座椅|底盘|动力|加速|空间|车机|配置|悬架|"
              r"电池|内饰|外观|操控|车漆|轮毂|芯片|雷达|快充|油耗|功率|扭矩|"
              r"安全气囊|后备箱|轴距|车长|纯电|增程|混动|版本"
          )
          SOURCE_POLICY_FACT = re.compile(
              r"20\d{2}年|\d{1,2}月|\d{1,2}日|(?:一|二|三|四|五|六|七|八|九|十|十一|十二)月|\d+(?:\.\d+)?\s*(?:元|万|万元|%|折)|"
              r"价格|报价|优惠|福利|权益|补贴|金融|首付|月供|免息|利息|锁单|"
              r"下定|提车价|指导价|库存|名额|限时|截止|截至|政策|新政|活动"
          )

          def _compact_source(value):
              return re.sub(r"[^0-9A-Za-z\u4e00-\u9fff]", "", str(value or "")).lower()

          def _source_is_current_model(title, content, vehicle_model):
              model = _compact_source(vehicle_model)
              core = re.sub(r"^(?:零跑汽车|零跑|leapmotor)", "", model)
              title_text = _compact_source(title)
              target_code = re.sub(r"\s+", "", core)
              title_codes = {
                  re.sub(r"\s+", "", value.lower())
                  for value in re.findall(r"(?i)[a-z]{1,5}\s*\d{1,3}", str(title or ""))
              }
              return bool(
                  ((model and model in title_text) or (len(core) >= 2 and core in title_text))
                  and (not title_codes or title_codes == {target_code})
              )

          def _planned_source_expectations(title, content, vehicle_model, policy):
              same_model = _source_is_current_model(title, content, vehicle_model)
              facts = [x.strip() for x in re.split(r"(?<=[。！？!?；;])|\n+", str(policy or "")) if x.strip()]
              fact_index = 0
              kept_lines = []
              for raw in str(content or "").splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith("#"):
                      kept_lines.append(line)
                      continue
                  if INTERACTION_TRIGGER.search(line):
                      continue
                  if SOURCE_POLICY_FACT.search(line) or UNSUPPORTED_STATUS.search(line):
                      if fact_index < len(facts):
                          kept_lines.append(line)
                          fact_index += 1
                      continue
                  if any(word in line for word in BANNED):
                      continue
                  if SOURCE_PRODUCT_FACT.search(line) and not same_model:
                      continue
                  kept_lines.append(line)
              return {
                  "same_model": same_model,
                  "line_count": len(kept_lines),
                  "emoji": re.findall(r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️]", "\n".join(kept_lines)),
              }

          def _style_opening(text, vehicle_model, brand):
              lines = [line.strip() for line in str(text or "").splitlines() if line.strip()]
              opening = "".join(lines[:2])
              for token in [str(vehicle_model or ""), str(brand or "")]:
                  if token:
                      opening = opening.replace(token, "车型")
              opening = re.sub(r"20\d{2}年\d{1,2}月\d{1,2}日|\d+", "数字", opening)
              opening = re.sub(r"[#\[\]话题\s，。！？、,.!~～—\-]", "", opening)
              return opening[:80]

          def _style_full(text, vehicle_model, brand):
              value = str(text or "")
              for token in [str(vehicle_model or ""), str(brand or "")]:
                  if token:
                      value = value.replace(token, "车型")
              value = re.sub(r"20\d{2}年\d{1,2}月\d{1,2}日|\d+(?:\.\d+)?", "数字", value)
              value = re.sub(r"#[^#\n]+(?:\[话题\])?#", "", value)
              value = re.sub(r"\s+", "", value)
              return value[:1200]

          def _section_signature(text):
              labels = []
              for line in str(text or "").splitlines():
                  clean = line.strip()
                  if not clean or len(clean) > 18:
                      continue
                  if re.match(r"^[✅🔹▫️📢🔥💡🚗📝📍]|^(?:一|二|三|四|五|六|七|八|九|十|\d+)[、.]", clean):
                      clean = re.sub(r"20\d{2}年\d{1,2}月\d{1,2}日|\d+", "数字", clean)
                      labels.append(clean)
              return labels

          def _policy_style_lines(policy, slot):
              """同一政策按槽位换说法；所有车型、日期和核验口径保持不变。"""
              raw_facts = [
                  part.strip() for part in re.split(r"(?<=[。！？!?；;])|\n+", str(policy or ""))
                  if part.strip()
              ]
              # 政策原文是唯一事实源，但原文中的禁用权益表述只能保留在
              # policy_evidence 审计字段，绝不能重新注入正文或图片文字。
              facts = [
                  fact for fact in raw_facts
                  if not any(word in fact for word in BANNED)
                  and not any(re.search(pattern, fact, flags=re.I) for pattern, _ in SEMANTIC_PATTERNS)
              ]
              if not facts:
                  return []
              deadline_fact = next((fact for fact in facts if re.search(r"截止|截至", fact)), "")
              gate_fact = next((fact for fact in facts if "门店公布" in fact and "现场核验" in fact), "")
              deadline = re.match(
                  r"^(.+?)(?:截止|截至)(20\d{2}年\d{1,2}月\d{1,2}日)[。！？!?；;]*$",
                  deadline_fact,
              )
              if not deadline or not gate_fact:
                  # 没有标准“截止+核验”句式时，也不能把整张政策表逐项照抄成
                  # 每篇相同的清单。按槽位轮换 2-3 条安全事实，既保真又去同质。
                  safe_non_model = [
                      fact for fact in facts
                      if not re.search(r"^车型[：:]", fact)
                  ] or facts
                  mode = (int(slot or 1) - 1) % 5
                  take = min(3, len(safe_non_model))
                  selected = [
                      safe_non_model[(mode * 2 + offset) % len(safe_non_model)]
                      for offset in range(take)
                  ]
                  return list(dict.fromkeys(selected))
              subject, date_text = deadline.groups()
              subject = subject.strip()
              mode = (int(slot or 1) - 1) % 5
              deadline_variants = [
                  f"准备参加{subject.replace('活动', '')}，可以先记下{date_text}这个时间点。",
                  f"{subject}的时间节点为{date_text}。",
                  f"准备看车的，可留意{subject}截至{date_text}。",
                  f"{subject.replace('活动', '')}的截止时间是{date_text}。",
                  f"计划到店看车时，{subject}可关注到{date_text}。",
              ]
              gate_variants = [
                  "具体时间与到店细节，可参考门店公布信息，并结合现场核验结果。",
                  "到店前可先查看门店公布内容，具体安排还需现场核验。",
                  "确认具体安排时，可参考门店公布信息和现场核验结果。",
                  "具体活动怎么安排，可结合门店公布信息与现场核验情况确认。",
                  "门店公布信息与现场核验情况，可作为确认具体安排的参考。",
              ]
              return [deadline_variants[mode], gate_variants[mode]]

          def _template_policy_close_hard(original_content, policy, vehicle_model, slot):
              facts = [
                  part.strip() for part in re.split(r"(?<=[。！？!?；;])|\n+", str(policy or ""))
                  if part.strip()
              ]
              cta_pattern = re.compile(
                  r"想预约|想体验|想知道|想了解|想看|想算|预约|咨询|滴滴|私信|"
                  r"留【|扣【|(?:城市|地区)\s*[+＋]|城市】|找我|发你|帮你"
              )
              source_lines = [
                  line.strip() for line in str(original_content or "").splitlines()
                  if line.strip() and not line.strip().startswith("#")
              ]
              source = next((line for line in reversed(source_lines) if cta_pattern.search(line)), "")
              if not source:
                  return ""
              model = str(vehicle_model or "").strip()
              model_label = re.sub(r"^(?:零跑汽车|零跑)", "", model, flags=re.I).strip() or model
              cue_tokens = re.findall(r"⬇️|👇|👉|💬|📩", source)
              cue = "".join(cue_tokens[:2]) or "⬇️💬"
              if "💬" not in cue and "📩" not in cue:
                  cue += "💬"
              combined = source + "\n" + str(policy or "")
              if "试驾" in source and "试驾" in str(policy or ""):
                  benefit = "了解本地方案和实车体验安排"
              elif any(word in combined for word in ("版本", "配置")):
                  benefit = "了解本地方案和版本明细"
              elif any(word in combined for word in ("补贴", "权益")):
                  benefit = "了解本地方案和权益明细"
              else:
                  benefit = "了解本月落地方案"
              tail_tokens = re.findall(r"💰|✨|✅|🔥|💡|💌", source)
              tail = tail_tokens[-1] if tail_tokens else "💰"
              return f"{cue}【城市＋{model_label}】，{benefit}{tail}"
              # 以下旧分支保留仅用于兼容历史 DSL；当前统一采用母版符号承接。
              deadline_fact = next((fact for fact in facts if re.search(r"截止|截至", fact)), "")
              deadline = re.search(r"20\d{2}年\d{1,2}月\d{1,2}日", deadline_fact)
              gate_ok = any("门店公布" in fact and "现场核验" in fact for fact in facts)
              ending_emoji = "".join(re.findall(
                  r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️💌👇📸📷💬📩]", source
              )[-2:])
              if not deadline or not gate_ok:
                  lead_variants = [
                      f"想知道{model}这次权益怎么搭配更合适？车型版本、购车方式和预算一起看会更清楚{ending_emoji}",
                      f"想核算{model}的购车方案？先把城市、版本和预算整理好，比较起来更清楚{ending_emoji}",
                      f"想了解{model}哪套金融方案更适合？把用车需求、车型版本和预算放在一起看{ending_emoji}",
                      f"想体验{model}实车、再核算本地方案？城市、版本和预算这三项先准备好{ending_emoji}",
                      f"想看{model}不同购车方式怎么选？按车型版本、预算和用车需求逐项比较更直观{ending_emoji}",
                  ]
                  variant_seed = int(hashlib.sha256(
                      (str(original_content or "") + "|" + model).encode("utf-8")
                  ).hexdigest()[:8], 16)
                  return lead_variants[variant_seed % len(lead_variants)]
              date_text = deadline.group(0)
              if "想知道" in source or "想算" in source or "？" in source or "?" in source:
                  return f"想知道{model}本地到店试驾怎么安排？活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              if "想预约" in source or "预约" in source:
                  return f"想预约{model}实车体验、了解这次到店试驾安排，活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              if "想体验" in source:
                  return f"想体验{model}、了解这次到店试驾安排，活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              if "想看" in source:
                  return f"想看{model}实车、了解试驾细节和到店安排，活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              if "想了解" in source:
                  return f"想了解{model}到店试驾信息，活动时间可留意至{date_text}，具体结合门店公布信息和现场核验情况确认{ending_emoji}"
              return ""

          def _apply_policy_style(content, image_prompt, image_blocks, original_content,
                                  policy, vehicle_model, slot):
              template_close = _template_policy_close_hard(
                  original_content, policy, vehicle_model, slot
              )
              policy_lines = _policy_style_lines(policy, slot)
              styled = policy_lines + ([template_close] if template_close else [])
              if not styled:
                  return content, image_prompt, image_blocks
              date_tokens = re.findall(r"20\d{2}年\d{1,2}月\d{1,2}日", str(policy or ""))
              kept = []
              tag_lines = []
              for raw in str(content or "").splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith("#"):
                      tag_lines.append(line)
                      continue
                  if re.search(r"[⬇️👇👉💬📩].{0,24}【(?:城市|地区)\s*[+＋]", line):
                      # 统一由 template_close 在原收尾区只保留一条，避免模型轻改后重复。
                      continue
                  if re.match(
                      r"^想(?:知道.+这次权益怎么搭配|核算.+的购车方案|了解.+哪套金融方案|体验.+实车、再核算本地方案|看.+不同购车方式怎么选)",
                      line,
                  ):
                      continue
                  looks_policy = (
                      any(token in line for token in date_tokens)
                      or ("门店" in line and ("核验" in line or "公布" in line))
                      or ("到店" in line and "试驾" in line and any(
                          marker in line for marker in ("活动", "截止", "时间", "留意", "安排")
                      ))
                  )
                  if not looks_policy:
                      kept.append(line)
              content = "\n".join(kept + styled + tag_lines).strip()

              facts = [
                  part.strip() for part in re.split(r"(?<=[。！？!?；;])|\n+", str(policy or ""))
                  if part.strip()
              ]
              if template_close:
                  for fact in facts:
                      image_prompt = str(image_prompt or "").replace(fact, "")
                      image_prompt = image_prompt.replace(fact.rstrip("。！？!?；;"), "")
                  image_prompt = re.sub(r"[；;。]{2,}", "；", str(image_prompt or ""))
                  image_prompt = image_prompt.rstrip(" ，,；;。")
              else:
                  for index, fact in enumerate(facts[:len(styled)]):
                      replacement = styled[index]
                      image_prompt = str(image_prompt or "").replace(fact, replacement)
                      image_prompt = image_prompt.replace(fact.rstrip("。！？!?；;"), replacement.rstrip("。"))
              updated_blocks = []
              for block in image_blocks or []:
                  text = str(block or "").strip()
                  if any(token in text for token in date_tokens) or ("门店" in text and "核验" in text):
                      text = styled[0]
                  if text and text not in updated_blocks:
                      updated_blocks.append(text)
              return content, image_prompt, updated_blocks

          def main(audited_text: str, policy_text: str, vehicle_knowledge, vehicle_model: str,
                   brand: str, account_name: str, vehicle_images_json: str,
                   prompt_candidates_json: str, copy_candidates_json: str,
                   history_body: str, post_count: str) -> dict:
              try:
                  items = _parse_json(audited_text)
              except Exception as exc:
                  raise ValueError("终审模型未返回有效 JSON 数组") from exc
              if not isinstance(items, list):
                  raise ValueError("终审结果必须是 JSON 数组")
              expected_count = max(1, min(5, int(post_count or 1)))
              if len(items) < expected_count:
                  raise ValueError("终审返回候选不足：至少需要 %s 篇，实际为 %s 篇" % (expected_count, len(items)))

              knowledge_records = vehicle_knowledge
              if isinstance(knowledge_records, str):
                  try:
                      knowledge_records = json.loads(knowledge_records)
                  except Exception:
                      knowledge_records = []
              if isinstance(knowledge_records, dict):
                  knowledge_records = knowledge_records.get("result") or []
              knowledge_text = "\n".join(
                  str(record.get("content") or "")
                  for record in list(knowledge_records or [])
                  if isinstance(record, dict)
              )
              if not knowledge_text.strip():
                  raise ValueError("当前车型产品知识为空，禁止在无产品依据时继续生产")

              recent_content_hashes = set()
              try:
                  history_raw = json.loads(history_body or "{}")
                  history_data = history_raw.get("data", history_raw) if isinstance(history_raw, dict) else {}
                  for task in list(history_data.get("items") or []):
                      request_id = str(task.get("client_request_id") or "")
                      match = re.match(r"xhs-p\d+-c([0-9a-f]{12})-", request_id)
                      if match:
                          recent_content_hashes.add(match.group(1))
              except Exception:
                  recent_content_hashes = set()

              vehicle_images = json.loads(vehicle_images_json or "[]")
              if not vehicle_images:
                  raise ValueError("没有可分配的车型辅助图")

              prompt_candidates = json.loads(prompt_candidates_json or "[]")
              prompt_by_id = {str(x.get("id")): x for x in prompt_candidates if isinstance(x, dict)}
              copy_candidates = json.loads(copy_candidates_json or "[]")
              copy_by_id = {str(x.get("id")): x for x in copy_candidates if isinstance(x, dict)}

              policy = str(policy_text or "")
              policy_model_match = re.search(r"(?:^|\n)\s*车型\s*[:：]\s*([^\n]+)", policy)
              policy_model = policy_model_match.group(1).strip() if policy_model_match else ""
              policy_model_required = re.sub(r"^(?:全新|零跑)+", "", policy_model, flags=re.I).strip()
              policy_markers = [
                  "试驾", "到店", "品鉴", "活动", "截止", "时间", "门店",
                  "政策", "权益", "补贴", "置换", "金融", "购车", "锁单", "交付"
              ]
              active_policy_markers = [marker for marker in policy_markers if marker in policy]
              safe_items = []
              blocked = []
              seen_primary = set()
              seen_styles = []

              for pos, item in enumerate(items):
                  if len(safe_items) >= expected_count:
                      break
                  reasons = []
                  if not isinstance(item, dict):
                      blocked.append({"slot": pos + 1, "reasons": ["结果不是对象"]})
                      continue
                  slot = pos + 1
                  selected_prompt_id = str(item.get("selected_prompt_id") or "")
                  if not item.get("selected_prompt_original") and selected_prompt_id in prompt_by_id:
                      item["selected_prompt_original"] = _text(
                          prompt_by_id[selected_prompt_id].get("chinese")
                      ).strip()
                  source_ids = [str(x) for x in (item.get("source_copy_ids") or [])]
                  source_ids = list(dict.fromkeys(source_ids))
                  primary_id = str(item.get("primary_copy_id") or "")
                  primary_original = copy_by_id.get(primary_id) or {}
                  original_title = _text(primary_original.get("title")).strip()
                  original_content = _text(primary_original.get("content")).strip()
                  source_expectations = _planned_source_expectations(
                      original_title, original_content, vehicle_model, policy
                  )
                  if policy_model_required:
                      normalized_source = re.sub(r"\s+", "", original_title + "\n" + original_content).lower()
                      normalized_policy_model = re.sub(r"\s+", "", policy_model_required).lower()
                      if normalized_policy_model not in normalized_source:
                          source_expectations["same_model"] = False
                  title = _remove_banned_tokens(_strip_interaction_clauses(_text(item.get("title"))))
                  # 对少量高风险夸张口语做局部降调，不因此挡掉整篇，也不重写母版标题。
                  title = re.sub(r"(?:杀疯了?|夯爆了?)", "值得看看", title)
                  title = re.sub(r"实锤了?", "整理好了", title)
                  title = re.sub(r"比打车还便宜", "通勤也实用", title)
                  content = _strip_banned_copy_clauses(_strip_interaction_clauses(_text(item.get("content"))))
                  content = content.replace("[庆祝R]", "🎉")
                  content = re.sub(r"打算冲(?=\s|零跑|全新)", "打算看", content)
                  content = "\n".join(
                      line for line in content.splitlines()
                      if not re.search(
                          r"对接了.{0,14}(?:渠道|资源)|全国.{0,14}(?:行情|报价).{0,8}(?:同步|更新)|"
                          r"真实成交参照|高关注地区|各地执行略有出入|^懂的$",
                          line,
                      )
                  ).strip()
                  content = re.sub(
                      r"说不定直接省出一笔[‘’“”\"']?改装基金[‘’“”\"']?",
                      "购车方式和版本信息也要重新核对",
                      content,
                  )
                  raw_unsupported_status = [
                      phrase for phrase in UNSUPPORTED_STATUS.findall(title + "\n" + content)
                      if phrase and phrase not in policy
                  ]
                  title = re.sub(r"[*_]{2,}", "", title)
                  content = re.sub(r"[*_]{2,}", "", content)
                  title = UNSUPPORTED_COPY_CLAIMS.sub("", title).strip(" -—丨|，,；;。")
                  content = _strip_unsupported_copy_clauses(content, policy)
                  image_prompt = _remove_banned_tokens(_strip_interaction_clauses(_text(item.get("image_prompt"))))
                  if not UNSUPPORTED_STATUS.search(policy):
                      title = UNSUPPORTED_STATUS.sub("活动信息", title)
                      content = UNSUPPORTED_STATUS.sub("活动信息", content)
                      image_prompt = UNSUPPORTED_STATUS.sub("活动信息", image_prompt)
                  image_prompt = META_MARKETING_CLAUSE.sub("", image_prompt).strip(" ，,；;。")
                  image_blocks = [
                      _remove_banned_tokens(_strip_interaction_clauses(str(x)))
                      for x in (item.get("image_text_blocks") or [])
                      if _remove_banned_tokens(_strip_interaction_clauses(str(x)))
                  ]
                  content = _dedupe_content(content, policy)
                  content = "\n".join(
                      line for line in content.splitlines()
                      if line.strip() and not re.fullmatch(r"[-—_•·|丨]+", line.strip())
                  ).strip()
                  content, image_prompt, image_blocks = _apply_policy_style(
                      content, image_prompt, image_blocks, original_content,
                      policy, vehicle_model, slot
                  )
                  # _apply_policy_style 会从政策原文选择安全事实；这里仍做第二次
                  # 确定性清洗，防止模型提示词或政策替换把禁用表达重新带回来。
                  content = _strip_banned_copy_clauses(
                      _strip_interaction_clauses(content)
                  )
                  content = _dedupe_content(content, policy)
                  image_prompt = _remove_banned_tokens(
                      _strip_interaction_clauses(image_prompt)
                  )
                  image_blocks = [
                      cleaned for cleaned in (
                          _remove_banned_tokens(_strip_interaction_clauses(str(block)))
                          for block in image_blocks
                      ) if cleaned
                  ]
                  # 精确车型版本来自政策首行。车型库可能只有基础目录名（如
                  # 零跑Lafa5），但政策明确为 Lafa5 Ultra 时，确定性补齐版本名，
                  # 不再让模型把 Ultra 漏掉，也不改变其它政策事实。
                  if policy_model_required:
                      normalized_copy = re.sub(r"\s+", "", title + "\n" + content).lower()
                      normalized_required = re.sub(r"\s+", "", policy_model_required).lower()
                      if normalized_required not in normalized_copy:
                          base_model = re.sub(r"^(?:全新|零跑)+", "", str(vehicle_model or ""), flags=re.I).strip()
                          if base_model and re.search(re.escape(base_model), title + "\n" + content, flags=re.I):
                              title = re.sub(re.escape(base_model), policy_model_required, title, flags=re.I)
                              content = re.sub(re.escape(base_model), policy_model_required, content, flags=re.I)
                          else:
                              content = ("车型：" + policy_model_required + "\n" + content).strip()
                  # 终审清洗可能连同互动句删掉母版 emoji；若其余内容仍有效，
                  # 从锁定主参考的安全 emoji 序列恢复一个，保持母版语气而不新增事实。
                  emoji_pattern = r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️💌👇📸📷💬📩✨🌸]"
                  if not re.search(emoji_pattern, title + content):
                      source_emojis = re.findall(emoji_pattern, original_title + "\n" + original_content)
                      if source_emojis:
                          content_lines = [line for line in content.splitlines() if line.strip()]
                          if content_lines:
                              content_lines[0] = content_lines[0].rstrip() + source_emojis[0]
                              content = "\n".join(content_lines)
                          elif title:
                              title = title.rstrip() + source_emojis[0]
                  policy_evidence = [str(x).strip() for x in (item.get("policy_evidence") or []) if str(x).strip()]
                  change_note = _text(item.get("prompt_change_note")).strip()
                  if not change_note or NO_SCENE_CHANGE.search(change_note):
                      change_note = "仅将背景环境轻微调整为同风格浅灰展厅。"
                      image_prompt = image_prompt.rstrip(" ，,；;。") + "；背景环境仅轻微调整为同风格浅灰展厅。"
                      item["prompt_change_note"] = change_note
                  item["title"] = title
                  item["content"] = content
                  item["image_prompt"] = image_prompt
                  item["image_text_blocks"] = image_blocks

                  scan_text = "\n".join([title, content, image_prompt, "\n".join(image_blocks)])
                  unsupported_dates = sorted(set(
                      token for token in re.findall(r"20\d{2}年|(?<![A-Za-z0-9])\d{1,2}\s*月|(?<![A-Za-z0-9])\d{1,2}\s*日", title + "\n" + content)
                      if token not in policy and token not in knowledge_text
                  ))
                  chinese_months = re.findall(
                      r"(?<![一二三四五六七八九十])(?:一|二|三|四|五|六|七|八|九|十|十一|十二)月",
                      title + "\n" + content,
                  )
                  unsupported_dates.extend(
                      token for token in chinese_months
                      if token not in policy and token not in knowledge_text
                  )
                  quarter_tokens = re.findall(
                      r"(?:Q[1-4]|第[一二三四]季度|[一二三四]季度)",
                      title + "\n" + content,
                      flags=re.I,
                  )
                  unsupported_dates.extend(
                      token for token in quarter_tokens
                      if token not in policy and token not in knowledge_text
                  )
                  unsupported_dates = sorted(set(unsupported_dates))
                  if unsupported_dates:
                      reasons.append("出现政策原文未提供的日期：" + "、".join(unsupported_dates))
                  claimed_counts = [int(x) for x in re.findall(r"(?<!\d)(\d{1,2})\s*(?:条|项|个|种)", title + "\n" + content)]
                  numbered_items = [int(x) for x in re.findall(r"(?m)^\s*(\d{1,2})[.、]", content)]
                  if claimed_counts and numbered_items and max(claimed_counts) != len(set(numbered_items)):
                      reasons.append("文案声称的条目数量与实际编号数量不一致")
                  hits = [word for word in BANNED if word in scan_text]
                  if hits:
                      reasons.append("命中禁用表达：" + "、".join(sorted(set(hits))))
                  semantic_hits = [label for pattern, label in SEMANTIC_PATTERNS if re.search(pattern, scan_text, flags=re.I)]
                  if semantic_hits:
                      reasons.append("命中禁用含义：" + "、".join(sorted(set(semantic_hits))))
                  # 配置/性能只审正文，不把提示词库原有的画面描述误判成文案事实。
                  # 同车型主参考中的既有产品事实允许高保真保留；跨车型主参考继续强拦截。
                  unsupported = UNSUPPORTED_FEATURES.findall(title + "\n" + content)
                  unsupported = [
                      x for x in unsupported
                      if x and x not in policy and x not in knowledge_text
                  ]
                  if unsupported:
                      reasons.append("出现政策原文未提供的配置或性能细节")
                  unsupported_status = UNSUPPORTED_STATUS.findall(title + "\n" + content)
                  unsupported_status = [phrase for phrase in unsupported_status if phrase and phrase not in policy]
                  unsupported_status.extend(raw_unsupported_status)
                  unsupported_status = sorted(set(unsupported_status))
                  if unsupported_status:
                      reasons.append("出现政策原文未确认的活动状态")
                  unsupported_copy_claims = UNSUPPORTED_COPY_CLAIMS.findall(title + "\n" + content)
                  unsupported_copy_claims = [
                      phrase for phrase in unsupported_copy_claims
                      if phrase and phrase not in policy and phrase not in knowledge_text
                  ]
                  if unsupported_copy_claims:
                      reasons.append("出现政策原文未提供的体验或产品判断")
                  policy_has_amount = bool(re.search(r"\d+(?:\.\d+)?\s*(?:元|万元|万|%)", policy))
                  prompt_for_price_scan = re.sub(
                      r"[^；;。\n]*(?:删除|去除|不使用|不得|避免)[^；;。\n]*(?:价格|金额|原价|现价|报价|补贴)[^；;。\n]*[；;。]?",
                      "",
                      image_prompt,
                  )
                  copy_amount_scan = title + "\n" + content + "\n" + "\n".join(image_blocks)
                  amount_scan = copy_amount_scan + "\n" + prompt_for_price_scan
                  # 图片提示词里的 35%/65% 等常用于版面占比，不是政策优惠数字。
                  # 金额仍扫描全文；百分比只扫描真正会发布的标题、正文和图片文字。
                  claimed_amounts = sorted(set(
                      re.findall(r"\d[\d,]*(?:\.\d+)?\s*(?:元|万元|万)", amount_scan)
                      + re.findall(r"\d[\d,]*(?:\.\d+)?\s*%", copy_amount_scan)
                  ))
                  unsupported_amounts = [
                      amount for amount in claimed_amounts
                      if amount.replace(" ", "").replace(",", "")
                      not in policy.replace(" ", "").replace(",", "")
                  ]
                  if unsupported_amounts:
                      reasons.append("出现政策原文未提供的金额：" + "、".join(unsupported_amounts))
                  price_scan = title + "\n" + content + "\n" + "\n".join(image_blocks) + "\n" + prompt_for_price_scan
                  if (NO_AMOUNT_POLICY.search(policy) or not policy_has_amount) and UNSUPPORTED_PRICE_LAYOUT.search(price_scan):
                      reasons.append("政策未提供对应金额，但文案或图片提示词仍含价格/金额表达")
                  if not title or not content:
                      reasons.append("标题或正文为空")
                  effective_lines = [line.strip() for line in content.splitlines() if line.strip()]
                  effective_chars = len(re.sub(r"[\s#，。！？、,.!~～—\-]", "", content))
                  if len(effective_lines) < 4 or effective_chars < 80:
                      reasons.append("正文过短或结构不完整：至少 4 个有效行且 80 个有效字符")
                  if len(policy_evidence) < 2:
                      reasons.append("政策依据不足 2 条，内容承载过少")
                  if not re.search(r"[✅🔹▫️📢🔥💡🚗📝📍👀👏💥🎉🎁⭐❤❤️💌👇📸📷💬📩✨🌸]", title + content):
                      reasons.append("标题或正文缺少原模板风格 emoji")
                  copy_text = title + "\n" + content
                  content_fingerprint = hashlib.sha256(
                      re.sub(r"[\s#，。！？、,.!~～—\-]", "", copy_text).lower().encode("utf-8")
                  ).hexdigest()[:12]
                  if content_fingerprint in recent_content_hashes:
                      reasons.append("与近期已提交文案完全重复")
                  if str(vehicle_model or "").strip() not in copy_text:
                      reasons.append("标题或正文没有明确保留用户指定车型")
                  if policy_model_required:
                      normalized_copy_text = re.sub(r"\s+", "", copy_text).lower()
                      normalized_policy_model = re.sub(r"\s+", "", policy_model_required).lower()
                      if normalized_policy_model not in normalized_copy_text:
                          reasons.append("标题或正文没有明确保留政策指定车型版本：" + policy_model)
                  if not policy_evidence:
                      reasons.append("缺少政策依据，正文可能没有承载用户政策")
                  # 政策可明说、模糊表达或仅作为本批审核依据，不强制每篇套同一个政策主题。
                  reasons.extend(_internal_repetition_reasons(content, policy))
                  if len(source_ids) not in (3, 4):
                      reasons.append("文案来源必须是 3-4 个不同 ID")
                  if any(not re.fullmatch(r"\d+", source_id) for source_id in source_ids):
                      reasons.append("文案来源 ID 必须是文案库中的真实数字 ID，禁止 UUID 或虚构 ID")
                  missing_source_ids = [source_id for source_id in source_ids if source_id not in copy_by_id]
                  if missing_source_ids:
                      reasons.append("文案来源 ID 不在本次真实候选中：" + "、".join(missing_source_ids))
                  expected_ids = [
                      str(x.get("id")) for x in copy_candidates[(slot - 1) * 4: slot * 4]
                      if isinstance(x, dict) and x.get("id") is not None
                  ]
                  if expected_ids and set(source_ids) != set(expected_ids):
                      reasons.append("没有使用当前槽位预分配的 4 条不同文案原文")
                  if not primary_id or primary_id not in source_ids:
                      reasons.append("主参考 ID 不在来源列表中")
                  if expected_ids and primary_id != expected_ids[0]:
                      reasons.append("没有使用本帖预锁定的第 1 条原文作为主参考")
                  if primary_id in seen_primary:
                      reasons.append("与本批其他文案重复使用主参考")
                  if not item.get("selected_prompt_id"):
                      reasons.append("缺少提示词库来源 ID")
                  elif str(item.get("selected_prompt_id")) not in prompt_by_id:
                      reasons.append("提示词来源 ID 不在本次真实候选中")
                  if not item.get("selected_prompt_original"):
                      reasons.append("缺少原提示词，无法证明是轻改")
                  elif str(item.get("selected_prompt_id")) in prompt_by_id:
                      original = _text(prompt_by_id[str(item.get("selected_prompt_id"))].get("chinese")).strip()
                      if original and original != _text(item.get("selected_prompt_original")).strip():
                          item["selected_prompt_original"] = original
                      numbered_levels = [int(x) for x in re.findall(r"(?:^|[；;。\s])([1-3])[\.、]", original)]
                      expected_blocks = max(numbered_levels) if numbered_levels else 0
                      if expected_blocks:
                          image_blocks = image_blocks[:expected_blocks]
                          if len(image_blocks) < expected_blocks:
                              brand_label = str(brand or "").strip()
                              if re.search(r"1[\.、].{0,40}(?:LOGO|品牌)", original, flags=re.I) and brand_label:
                                  if brand_label not in image_blocks:
                                      image_blocks.insert(0, brand_label)
                                      image_blocks = image_blocks[:expected_blocks]
                              policy_fillers = [
                                  part.strip(" ，,。；;：:")
                                  for part in re.split(r"[。；;\n]+", policy)
                                  if part.strip(" ，,。；;：:")
                              ]
                              safe_fillers = [brand_label, str(vehicle_model or "").strip(), title] + policy_fillers
                              added_levels = []
                              for filler in safe_fillers:
                                  if len(image_blocks) >= expected_blocks:
                                      break
                                  if filler and filler not in image_blocks:
                                      image_blocks.append(filler)
                                      added_levels.append((len(image_blocks), filler))
                              for level, filler in added_levels:
                                  if filler not in image_prompt:
                                      image_prompt += f"；{level}. 保持原提示词第{level}层文字的原位置、字号和对齐方式，文字替换为「{filler}」"
                          if len(image_blocks) != expected_blocks:
                              reasons.append(f"图片文字层级数量应保留为 {expected_blocks} 层，当前为 {len(image_blocks)} 层")
                  # 只有与“改为/调整/替换/新增”等修改动词处于同一分句的维度
                  # 才计作实际改动；“车辆角度保持一致”不能反向误判为改了角度。
                  changed_terms = []
                  for term in ["场景", "背景", "角度", "视角", "颜色", "车身", "排版", "文字区块"]:
                      changed = bool(
                          re.search(
                              rf"(?:将|把)?[^。；;]{{0,8}}{term}[^。；;]{{0,24}}(?:改为|调整为?|替换为?|修改为?|新增|变化)",
                              change_note,
                          )
                          or re.search(
                              rf"(?:改为|调整为?|替换为?|修改为?|新增|变化)[^。；;]{{0,24}}{term}",
                              change_note,
                          )
                      )
                      if changed:
                          changed_terms.append(term)
                  changed_dimensions = len(changed_terms)
                  if changed_dimensions > 2 or (("角度" in changed_terms or "视角" in changed_terms or "颜色" in changed_terms) and ("场景" in changed_terms or "背景" in changed_terms)):
                      reasons.append("提示词同时改动多个视觉维度，不属于轻微场景变化")
                  if not image_blocks:
                      reasons.append("图片必须包含文字区块")
                  for evidence in policy_evidence:
                      if evidence not in policy:
                          reasons.append("政策依据不在政策原文中：" + evidence[:30])

                  if original_content:
                      draft_lines = [line for line in content.splitlines() if line.strip()]
                      expected_line_count = source_expectations["line_count"]
                      # 合规删除含禁用词的整行后，行数允许有小幅收缩；只有明显
                      # 脱离母版（不足 2 行或膨胀到约两倍）才阻断。
                      if len(draft_lines) > max(expected_line_count + 8, expected_line_count * 2) or len(draft_lines) < 2:
                          reasons.append("成稿行数未按逐行执行计划输出")

                  opening = _style_opening(content, vehicle_model, brand)
                  full_style = _style_full(content, vehicle_model, brand)
                  labels = _section_signature(content)
                  for previous in seen_styles:
                      opening_ratio = SequenceMatcher(None, opening, previous["opening"]).ratio() if opening and previous["opening"] else 0
                      full_ratio = SequenceMatcher(None, full_style, previous["full"]).ratio() if full_style and previous["full"] else 0
                      common_labels = set(labels) & set(previous["labels"])
                      label_ratio = len(common_labels) / max(1, min(len(set(labels)), len(set(previous["labels"]))))
                      if (
                          full_ratio >= 0.66
                          or (opening_ratio >= 0.82 and label_ratio >= 0.50)
                          or (len(labels) >= 3 and len(previous["labels"]) >= 3 and label_ratio >= 0.85)
                      ):
                          reasons.append("与本批其他文案的开头或分段骨架过于相似")
                          break

                  if reasons:
                      blocked.append({
                          "slot": slot,
                          "title": title,
                          "reasons": reasons,
                          "source_copy_ids": source_ids,
                          "selected_prompt_id": item.get("selected_prompt_id")
                      })
                      continue

                  seen_primary.add(primary_id)
                  seen_styles.append({"opening": opening, "full": full_style, "labels": labels})
                  angle_text = (image_prompt + "\n" + _text(item.get("selected_prompt_original"))).lower()
                  preferred_label = ""
                  if re.search(r"纯侧面|正侧面|侧面平视|side profile", angle_text):
                      preferred_label = "侧面"
                  elif re.search(r"斜前|侧前|左前|右前|45[°度]|30[°度]", angle_text):
                      preferred_label = "斜前"
                  elif re.search(r"正前|前脸正视|front view", angle_text):
                      preferred_label = "正前"
                  elif re.search(r"斜后|侧后|左后|右后", angle_text):
                      preferred_label = "斜后"
                  elif re.search(r"正后|车尾正视|rear view", angle_text):
                      preferred_label = "正后"
                  vehicle_image = next(
                      (img for img in vehicle_images if preferred_label and preferred_label in str(img.get("label", ""))),
                      vehicle_images[(slot - 1) % len(vehicle_images)]
                  )
                  item["candidate_slot"] = slot
                  item["slot"] = len(safe_items) + 1
                  item["content_fingerprint"] = content_fingerprint
                  item["title"] = title
                  item["content"] = content
                  item["image_prompt"] = image_prompt
                  item["source_copy_ids"] = source_ids
                  item["primary_copy_id"] = primary_id
                  item["image_text_blocks"] = image_blocks[:3]
                  item["brand"] = str(brand or "").strip()
                  item["vehicle_model"] = str(vehicle_model or "").strip()
                  item["account_name"] = str(account_name or "").strip()
                  item["vehicle_image"] = vehicle_image
                  safe_items.append(json.dumps(item, ensure_ascii=False))

              if len(safe_items) < expected_count:
                  reason_summary = "；".join(
                      "候选%s:%s" % (row.get("slot"), "、".join(row.get("reasons") or [])[:180])
                      for row in blocked[:8]
                  )
                  raise ValueError(
                      "自动候选池仍未补满：目标 %s 篇，通过 %s 篇。%s"
                      % (expected_count, len(safe_items), reason_summary)
                  )

              return {
                  "safe_items": safe_items,
                  "blocked_json": json.dumps(blocked, ensure_ascii=False),
                  "safe_count": len(safe_items),
                  "blocked_count": len(blocked)
              }
        code_language: python3
        desc: 确切词扫描、来源数量、政策证据、车型和有字配图的最终闸门；不合格项不送生图。
        outputs:
          blocked_count:
            children: null
            type: number
          blocked_json:
            children: null
