    id: 63ecf424-e671-401e-af52-4f814c3a1001
    name: BACKEND_BASE_URL
    selector:
    - env
    - BACKEND_BASE_URL
    value: http://47.98.127.132:18080/api/backend
    value_type: string
  - description: Web 线上服务登录用户名
    id: 63ecf424-e671-401e-af52-4f814c3a1002
    name: BACKEND_USERNAME
    selector:
    - env
    - BACKEND_USERNAME
    value: ''
    value_type: secret
  - description: Web 线上服务登录密码
