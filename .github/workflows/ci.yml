name: v0.2 release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DEPLOYMENT_ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./test_ai_creative.db
      STORAGE_TYPE: local
      STORAGE_PATH: ./test_uploads
      JWT_SECRET_KEY: test-secret-key-for-ci-only
      XHS_WORKER_INTERNAL_TOKEN: test-worker-token
      XHS_ENABLE_SCHEDULED_PUBLISH_LOOP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q app
      - name: Check Alembic graph
        run: python scripts/check_alembic_heads.py
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_VERSION: 0.2.0-ci
          NEXT_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_TIME: ci
        run: npm run build

  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ztqc-web-ci
      APP_ENV: production
      DEPLOYMENT_ENVIRONMENT: production
      PRODUCTION_CONFIRMATION: ALLOW_PRODUCTION_DEPLOYMENT
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_SECRET_KEY: ci-jwt-secret
      XHS_WORKER_INTERNAL_TOKEN: ci-worker-token
      MINIO_ROOT_USER: ci-minio
      MINIO_ROOT_PASSWORD: ci-minio-password
      APP_VERSION: 0.2.0-ci
      GIT_COMMIT: ${{ github.sha }}
      BUILD_TIME: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for secrets
        run: python scripts/check_tracked_secrets.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build release images
        run: docker compose build backend frontend
