version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_creative
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_creative
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-key-not-for-production-a1b2c3d4e5f6
      CORS_ORIGINS: '["http://localhost:3000"]'
      STORAGE_TYPE: local
      STORAGE_PATH: ./uploads
      SEEDREAM_API_KEY: 13463e13-d95f-4f65-ba9c-d3ddde270274
      SEEDREAM_API_URL: https://ark.cn-beijing.volces.com/api/v3/images/generations
      GPT_IMAGE2_API_KEY: sk-tSBuo4K8OkcD8c11ntNfW7m9tvlNYN9JHYytMMAOrGjbV6yH
      GPT_IMAGE2_API_URL: https://chunfeng.mentalout.top/v1/images/generations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend:8000
        NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    environment:
      BACKEND_ORIGIN: http://backend:8000
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
  upload_data:
