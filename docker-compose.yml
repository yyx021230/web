name: ${COMPOSE_PROJECT_NAME:-web}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-20m}"
    max-file: "${LOG_MAX_FILES:-5}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15.13-alpine}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-1000}
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-150}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_creative}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_user} -d ${POSTGRES_DB:-ai_creative}"]
      interval: 5s
      timeout: 5s
      retries: 5
    shm_size: ${POSTGRES_SHM_SIZE:-512m}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-4g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.5-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: ${REDIS_MEMORY_LIMIT:-2g}
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    logging: *default-logging

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    mem_limit: ${MINIO_MEMORY_LIMIT:-2g}
    cpus: ${MINIO_CPU_LIMIT:-1.0}
    logging: *default-logging

  backend:
    image: ${APP_IMAGE_PREFIX:-ztqc}/backend:${APP_VERSION:-0.3.13}
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11.13-slim-bookworm}
        APP_VERSION: ${APP_VERSION:-0.3.13}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      PRODUCTION_CONFIRMATION: ${PRODUCTION_CONFIRMATION:-}
      APP_VERSION: ${APP_VERSION:-0.3.13}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ai_creative}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: /app/uploads
      XHS_MCP_BROWSER_DOWNLOAD_DIR: "${XHS_MCP_BROWSER_DOWNLOAD_DIR:-C:\\projects\\web\\uploads\\mcp-downloads}"
      XHS_MCP_CONTAINER_DOWNLOAD_DIR: ${XHS_MCP_CONTAINER_DOWNLOAD_DIR:-/app/uploads/mcp-downloads}
      XHS_WORKER_INTERNAL_TOKEN: ${XHS_WORKER_INTERNAL_TOKEN:?set XHS_WORKER_INTERNAL_TOKEN in .env}
      XHS_MCP_BIN_PATH: ${XHS_MCP_BIN_PATH:-/app/bin/xiaohongshu-mcp}
      XHS_PROFILE_FETCH_TIMEOUT_SECONDS: ${XHS_PROFILE_FETCH_TIMEOUT_SECONDS:-300}
      XHS_YUNDENG_SYNC_CONCURRENCY: ${XHS_YUNDENG_SYNC_CONCURRENCY:-5}
      XHS_YUNDENG_LEASE_SECONDS: ${XHS_YUNDENG_LEASE_SECONDS:-1800}
      XHS_YUNDENG_ACQUIRE_TIMEOUT_SECONDS: ${XHS_YUNDENG_ACQUIRE_TIMEOUT_SECONDS:-3600}
      XHS_YUNDENG_START_STAGGER_SECONDS: ${XHS_YUNDENG_START_STAGGER_SECONDS:-2}
      XHS_YUNDENG_DISTRIBUTED_COORDINATOR_ENABLED: ${XHS_YUNDENG_DISTRIBUTED_COORDINATOR_ENABLED:-true}
      AI_IMAGE_SHADOW_ENABLED: ${AI_IMAGE_SHADOW_ENABLED:-false}
      AI_IMAGE_RECONCILIATION_ENABLED: ${AI_IMAGE_RECONCILIATION_ENABLED:-false}
      AI_IMAGE_RECONCILIATION_INTERVAL_SECONDS: ${AI_IMAGE_RECONCILIATION_INTERVAL_SECONDS:-60}
      AI_IMAGE_RECONCILIATION_BATCH_SIZE: ${AI_IMAGE_RECONCILIATION_BATCH_SIZE:-20}
      REMOVE_AI_WATERMARKS_ENABLED: ${REMOVE_AI_WATERMARKS_ENABLED:-true}
      REMOVE_AI_WATERMARKS_API_URL: ${REMOVE_AI_WATERMARKS_API_URL:-http://47.98.127.132/pureimage/watermark-api/remove-watermark}
      REMOVE_AI_WATERMARKS_TIMEOUT: ${REMOVE_AI_WATERMARKS_TIMEOUT:-240}
      REMOVE_AI_WATERMARKS_STRICT: ${REMOVE_AI_WATERMARKS_STRICT:-true}
      REMOVE_AI_WATERMARKS_MAX_CONCURRENT: ${REMOVE_AI_WATERMARKS_MAX_CONCURRENT:-4}
      REMOVE_AI_WATERMARKS_RETRIES: ${REMOVE_AI_WATERMARKS_RETRIES:-5}
      REMOVE_AI_WATERMARKS_RETRY_DELAY_SECONDS: ${REMOVE_AI_WATERMARKS_RETRY_DELAY_SECONDS:-5}
      XHS_HOMEPAGE_SYNC_SHADOW_ENABLED: ${XHS_HOMEPAGE_SYNC_SHADOW_ENABLED:-false}
      XHS_ENGAGEMENT_DETAIL_SYNC_SHADOW_ENABLED: ${XHS_ENGAGEMENT_DETAIL_SYNC_SHADOW_ENABLED:-false}
      XHS_REPORT_REFRESH_SHADOW_ENABLED: ${XHS_REPORT_REFRESH_SHADOW_ENABLED:-false}
      DIFY_TASK_SHADOW_ENABLED: ${DIFY_TASK_SHADOW_ENABLED:-false}
      SCHEDULER_LEADER_ENABLED: ${SCHEDULER_LEADER_ENABLED:-true}
      SCHEDULER_LEADER_LEASE_SECONDS: ${SCHEDULER_LEADER_LEASE_SECONDS:-30}
      SCHEDULER_LEADER_HEARTBEAT_SECONDS: ${SCHEDULER_LEADER_HEARTBEAT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${UPLOADS_HOST_PATH:-./uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: ${BACKEND_MEMORY_LIMIT:-6g}
    cpus: ${BACKEND_CPU_LIMIT:-3.0}
    logging: *default-logging

  ai-worker:
    image: ${APP_IMAGE_PREFIX:-ztqc}/backend:${APP_VERSION:-0.3.13}
    command: ["python", "-m", "app.scripts.ai_worker"]
    restart: unless-stopped
    stop_grace_period: 45m
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      PRODUCTION_CONFIRMATION: ${PRODUCTION_CONFIRMATION:-}
      APP_VERSION: ${APP_VERSION:-0.3.13}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ai_creative}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: /app/uploads
      XHS_WORKER_INTERNAL_TOKEN: ${XHS_WORKER_INTERNAL_TOKEN:?set XHS_WORKER_INTERNAL_TOKEN in .env}
      AI_TASK_WORKER_CONCURRENCY: ${AI_TASK_WORKER_CONCURRENCY:-15}
      AI_TASK_WORKER_MIN_INTERVAL_SECONDS: ${AI_TASK_WORKER_MIN_INTERVAL_SECONDS:-10}
      AI_IMAGE_SHADOW_ENABLED: ${AI_IMAGE_SHADOW_ENABLED:-false}
      AI_IMAGE_RECONCILIATION_ENABLED: ${AI_IMAGE_RECONCILIATION_ENABLED:-false}
      AI_IMAGE_RECONCILIATION_INTERVAL_SECONDS: ${AI_IMAGE_RECONCILIATION_INTERVAL_SECONDS:-60}
      AI_IMAGE_RECONCILIATION_BATCH_SIZE: ${AI_IMAGE_RECONCILIATION_BATCH_SIZE:-20}
      REMOVE_AI_WATERMARKS_ENABLED: ${REMOVE_AI_WATERMARKS_ENABLED:-true}
      REMOVE_AI_WATERMARKS_API_URL: ${REMOVE_AI_WATERMARKS_API_URL:-http://47.98.127.132/pureimage/watermark-api/remove-watermark}
      REMOVE_AI_WATERMARKS_TIMEOUT: ${REMOVE_AI_WATERMARKS_TIMEOUT:-240}
      REMOVE_AI_WATERMARKS_STRICT: ${REMOVE_AI_WATERMARKS_STRICT:-true}
      REMOVE_AI_WATERMARKS_MAX_CONCURRENT: ${REMOVE_AI_WATERMARKS_MAX_CONCURRENT:-4}
      REMOVE_AI_WATERMARKS_RETRIES: ${REMOVE_AI_WATERMARKS_RETRIES:-5}
      REMOVE_AI_WATERMARKS_RETRY_DELAY_SECONDS: ${REMOVE_AI_WATERMARKS_RETRY_DELAY_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${UPLOADS_HOST_PATH:-./uploads}:/app/uploads
    mem_limit: ${AI_WORKER_MEMORY_LIMIT:-12g}
    cpus: ${AI_WORKER_CPU_LIMIT:-4.0}
    logging: *default-logging

  frontend:
    image: ${APP_IMAGE_PREFIX:-ztqc}/frontend:${APP_VERSION:-0.3.13}
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20.19.4-alpine3.22}
        BACKEND_ORIGIN: http://backend:8000
        NEXT_PUBLIC_API_BASE: /api/backend
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-0.3.13}
        NEXT_PUBLIC_GIT_COMMIT: ${GIT_COMMIT:-unknown}
        NEXT_PUBLIC_BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_ORIGIN: http://backend:8000
      NEXT_PUBLIC_API_BASE: /api/backend
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-0.3.13}
      NEXT_PUBLIC_GIT_COMMIT: ${GIT_COMMIT:-unknown}
      NEXT_PUBLIC_BUILD_TIME: ${BUILD_TIME:-unknown}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-2g}
    cpus: ${FRONTEND_CPU_LIMIT:-2.0}
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  miniodata:
