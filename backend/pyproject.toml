[project]
name = "ai-creative-studio"
version = "0.3.10"
description = "AI Creative Studio - Design editor with AI and Dify integration"
requires-python = ">=3.9"

dependencies = [
    "fastapi==0.128.8",
    "uvicorn[standard]==0.39.0",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "alembic==1.16.5",
    "pydantic[email]==2.13.3",
    "pydantic-settings==2.11.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "redis==7.0.1",
    "minio==7.2.20",
    "oss2==2.19.1",
    "python-dotenv==1.2.1",
    "aiofiles==25.1.0",
    "pillow==11.3.0",
    "numpy==2.0.2",
    "openpyxl==3.1.5",
    "eval_type_backport==0.3.1; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.11",
    "mypy==1.19.1",
    "aiosqlite==0.22.1",
]
